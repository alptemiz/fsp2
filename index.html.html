&lt;script&gt;(function(){
  const sel=document.getElementById(&#x27;caseSelect&#x27;);
  const cases=[...document.querySelectorAll(&#x27;.case&#x27;)];

  const allOption=document.createElement(&#x27;option&#x27;);
  allOption.value=&#x27;all&#x27;;
  allOption.textContent=&#x27;Alle Fälle&#x27;;
  sel.appendChild(allOption);

  const optionGroups=new Map();
  cases.forEach((section,i)=&gt;{
    const option=document.createElement(&#x27;option&#x27;);
    option.value=&#x27;c&#x27;+i;
    option.textContent=section.querySelector(&#x27;h2&#x27;).textContent;
    const category=section.dataset.category;
    if(category){
      if(!optionGroups.has(category)){
        const group=document.createElement(&#x27;optgroup&#x27;);
        group.label=category;
        optionGroups.set(category,group);
        sel.appendChild(group);
      }
      optionGroups.get(category).appendChild(option);
    }else{
      sel.appendChild(option);
    }
    section.dataset.v=&#x27;c&#x27;+i;
  });

  function rowKey(row){
    return Array.from(row.querySelectorAll(&#x27;.case-col-left h3&#x27;))
      .map(heading=&gt;heading.textContent.trim())
      .filter(Boolean)
      .join(&#x27; / &#x27;);
  }

  function patientGender(section){
    const diagnosisRow=Array.from(section.querySelectorAll(&#x27;:scope &gt; .case-card &gt; .case-row&#x27;))
      .find(row=&gt;rowKey(row)===&#x27;(Verdachts-)Diagnose/Leitsymptom / Name, Alter&#x27;);
    const text=diagnosisRow?.querySelector(&#x27;.case-col-right&#x27;)?.textContent||&#x27;&#x27;;
    return /\bPatientin\b/.test(text)?&#x27;female&#x27;:&#x27;male&#x27;;
  }
  cases.forEach(section=&gt;{
    section.dataset.patientGender=patientGender(section);
  });

  function formatPatientIntro(section){
    const diagnosisRow=Array.from(section.querySelectorAll(&#x27;:scope &gt; .case-card &gt; .case-row&#x27;))
      .find(row=&gt;rowKey(row)===&#x27;(Verdachts-)Diagnose/Leitsymptom / Name, Alter&#x27;);
    const li=diagnosisRow?.querySelector(&#x27;.case-col-right .learn-item&#x27;);
    const strong=li?.querySelector(&#x27;:scope &gt; strong&#x27;);
    if(!li||!strong) return;
    const tail=Array.from(li.childNodes)
      .filter(node=&gt;node!==strong)
      .map(node=&gt;node.textContent)
      .join(&#x27;&#x27;)
      .trim();
    const firstBreak=tail.indexOf(&#x27;,&#x27;);
    const secondBreak=tail.indexOf(&#x27; mit &#x27;,firstBreak+1);
    if(firstBreak&lt;0||secondBreak&lt;0) return;
    const patientName=tail.slice(0,firstBreak+1).trim();
    const patientDescription=tail.slice(firstBreak+1,secondBreak).trim();
    const diagnosis=tail.slice(secondBreak+1).trim();
    li.replaceChildren(
      strong,
      document.createTextNode(&#x27; &#x27;+patientName),
      document.createElement(&#x27;br&#x27;),
      document.createTextNode(&#x27;\u00a0\u00a0\u00a0\u00a0&#x27;+patientDescription),
      document.createElement(&#x27;br&#x27;),
      document.createTextNode(&#x27;\u00a0\u00a0\u00a0\u00a0&#x27;+diagnosis)
    );
  }
  cases.forEach(formatPatientIntro);

  const comparisonGroups=[
    {label:&#x27;1. Rahmen&#x27;,keys:[&#x27;Rahmen&#x27;]},
    {label:&#x27;2. Diagnose, Name und Alter&#x27;,keys:[&#x27;(Verdachts-)Diagnose/Leitsymptom / Name, Alter&#x27;]},
    {label:&#x27;3. Hergang bei der Aufnahme&#x27;,keys:[&#x27;Hergang bei der Aufnahme&#x27;]},

    {label:&#x27;6. Bisherige Medikation&#x27;,keys:[&#x27;Bisherige Medikation&#x27;]},
    {label:&#x27;7. Allergien&#x27;,keys:[&#x27;Allergien&#x27;]},
    {label:&#x27;8. Risikofaktoren&#x27;,keys:[&#x27;Risikofaktoren&#x27;]},
    {label:&#x27;9. Sozialanamnese&#x27;,keys:[&#x27;Sozialanamnese&#x27;]},
    {label:&#x27;10. Familienanamnese&#x27;,keys:[&#x27;Familienanamnese&#x27;]},
    {label:&#x27;11. Vitalparameter&#x27;,keys:[&#x27;Vitalparameter bei Aufnahme&#x27;]},
    {label:&#x27;12. Körperliche Untersuchung&#x27;,keys:[&#x27;Körperliche Untersuchung&#x27;]},
    {label:&#x27;13. Labor und apparative Diagnostik&#x27;,keys:[&#x27;Wichtige Laborwerte&#x27;,&#x27;Wichtige apparative Untersuchungen&#x27;]},
    {label:&#x27;14. Therapie&#x27;,keys:[&#x27;Neu angesetzte/umgestellte Medikation&#x27;]},
    {label:&#x27;15. Stationärer Verlauf&#x27;,keys:[&#x27;Stationärer Verlauf&#x27;]},
    {label:&#x27;16. Procedere&#x27;,keys:[&#x27;Procedere&#x27;]}
  ];

  const comparisonControl=document.createElement(&#x27;div&#x27;);
  comparisonControl.className=&#x27;comparison-select-control floating-control&#x27;;
  const comparisonLabel=document.createElement(&#x27;label&#x27;);
  comparisonLabel.htmlFor=&#x27;comparisonSectionSelect&#x27;;

  comparisonSelect.id=&#x27;comparisonSectionSelect&#x27;;
  comparisonGroups.forEach((group,index)=&gt;{
    const option=document.createElement(&#x27;option&#x27;);
    option.value=&#x27;g&#x27;+index;
    option.textContent=group.label;
    comparisonSelect.appendChild(option);
  });
  comparisonControl.append(comparisonLabel,comparisonSelect);
  document.body.appendChild(comparisonControl);

  const missingMessages={
    &#x27;Vorerkrankungen&#x27;:&#x27;Relevante Vorerkrankungen seien nicht bekannt.&#x27;,
    &#x27;Bisherige Medikation&#x27;:&#x27;In Bezug auf die Medikation lägen keine Angaben vor.&#x27;,

    &#x27;Risikofaktoren&#x27;:&#x27;Relevante Risikofaktoren seien nicht bekannt.&#x27;,
    &#x27;Sozialanamnese&#x27;:&#x27;Zur Sozialanamnese lägen keine Angaben vor.&#x27;,
    &#x27;Familienanamnese&#x27;:&#x27;Zur Familienanamnese lägen keine Angaben vor.&#x27;,
    &#x27;Wichtige apparative Untersuchungen&#x27;:&#x27;Zu apparativen Untersuchungen lägen keine Angaben vor.&#x27;,
    &#x27;Neu angesetzte/umgestellte Medikation&#x27;:&#x27;Zu einer neu angesetzten oder umgestellten Medikation lägen keine Angaben vor.&#x27;
  };

  function createMissingRow(key){
    const row=document.createElement(&#x27;div&#x27;);
    row.className=&#x27;case-row&#x27;;
    const left=document.createElement(&#x27;div&#x27;);
    left.className=&#x27;case-col case-col-left&#x27;;
    const heading=document.createElement(&#x27;h3&#x27;);
    heading.textContent=key;
    const leftList=document.createElement(&#x27;ul&#x27;);
    const leftItem=document.createElement(&#x27;li&#x27;);
    leftItem.textContent=&#x27;keine Angaben dokumentiert&#x27;;
    leftList.appendChild(leftItem);
    left.append(heading,leftList);
    const right=document.createElement(&#x27;div&#x27;);
    right.className=&#x27;case-col case-col-right&#x27;;
    const rightList=document.createElement(&#x27;ul&#x27;);
    const rightItem=document.createElement(&#x27;li&#x27;);
    rightItem.className=&#x27;learn-item&#x27;;
    const sentence=document.createElement(&#x27;strong&#x27;);
    sentence.textContent=missingMessages[key]||&#x27;Zu diesem Abschnitt lägen keine Angaben vor.&#x27;;
    rightItem.appendChild(sentence);
    rightList.appendChild(rightItem);
    right.appendChild(rightList);
    row.append(left,right);
    return row;
  }

  const allView=document.createElement(&#x27;article&#x27;);
  allView.className=&#x27;comparison-view&#x27;;
  allView.id=&#x27;allCasesComparison&#x27;;
  comparisonGroups.forEach((group,groupIndex)=&gt;{
    const comparisonSection=document.createElement(&#x27;section&#x27;);
    comparisonSection.className=&#x27;comparison-section&#x27;;
    if(group.keys.length===1) comparisonSection.classList.add(&#x27;single-key-section&#x27;);
    comparisonSection.dataset.group=&#x27;g&#x27;+groupIndex;
    const card=document.createElement(&#x27;div&#x27;);
    card.className=&#x27;case-card&#x27;;
    if(groupIndex===1){
      const note=document.createElement(&#x27;div&#x27;);
      note.className=&#x27;diagnosis-grammar-note&#x27;;
      note.innerHTML=`
        &lt;div class=&quot;grammar-caption&quot;&gt;Kurzhilfe zur Diagnoseformulierung&lt;/div&gt;

          &lt;h4&gt;Artikel&lt;/h4&gt;
          &lt;table&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;die&lt;/th&gt;&lt;th&gt;der&lt;/th&gt;&lt;th&gt;das&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;-itis&lt;/td&gt;&lt;td&gt;-infarkt&lt;/td&gt;&lt;td&gt;-versagen&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;-ie&lt;/td&gt;&lt;td&gt;-schock&lt;/td&gt;&lt;td&gt;-flimmern&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;-ose&lt;/td&gt;&lt;td&gt;-schwindel&lt;/td&gt;&lt;td&gt;-trauma&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;-ung&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;Asthma&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;-ur&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;
        &lt;div class=&quot;grammar-declension-grid&quot;&gt;
          &lt;div class=&quot;grammar-box&quot;&gt;
            &lt;h4&gt;Adjektivdeklination ohne Artikel im Dativ, &lt;span class=&quot;grammar-prefix&quot;&gt;mit&lt;/span&gt;&lt;/h4&gt;
            &lt;table&gt;
              &lt;thead&gt;&lt;tr&gt;&lt;th&gt;die&lt;/th&gt;&lt;th&gt;der&lt;/th&gt;&lt;th&gt;das&lt;/th&gt;&lt;th&gt;Plural&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
              &lt;tbody&gt;
                &lt;tr&gt;&lt;td&gt;&lt;strong&gt;-r&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;-m&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;-m&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;-n&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
                &lt;tr class=&quot;grammar-example&quot;&gt;&lt;td&gt;&lt;span class=&quot;grammar-prefix&quot;&gt;mit&lt;/span&gt; akut&lt;strong&gt;er&lt;/strong&gt; Cholezystitis&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;grammar-prefix&quot;&gt;mit&lt;/span&gt; anaphylaktisch&lt;strong&gt;em&lt;/strong&gt; Schock&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;grammar-prefix&quot;&gt;mit&lt;/span&gt; akut&lt;strong&gt;em&lt;/strong&gt; Nierenversagen&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;grammar-prefix&quot;&gt;mit&lt;/span&gt; rechtsseitig&lt;strong&gt;en&lt;/strong&gt; Rippenfrakturen&lt;/td&gt;&lt;/tr&gt;
              &lt;/tbody&gt;
            &lt;/table&gt;
          &lt;/div&gt;
          &lt;div class=&quot;grammar-box&quot;&gt;
            &lt;h4&gt;Adjektivdeklination ohne Artikel im Akkusativ, &lt;span class=&quot;grammar-prefix&quot;&gt;bei Verdacht auf&lt;/span&gt;&lt;/h4&gt;
            &lt;table&gt;
              &lt;thead&gt;&lt;tr&gt;&lt;th&gt;die&lt;/th&gt;&lt;th&gt;der&lt;/th&gt;&lt;th&gt;das&lt;/th&gt;&lt;th&gt;Plural&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
              &lt;tbody&gt;
                &lt;tr&gt;&lt;td&gt;&lt;strong&gt;-e&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;-n&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;-s&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;-e&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
                &lt;tr class=&quot;grammar-example&quot;&gt;&lt;td&gt;&lt;span class=&quot;grammar-prefix&quot;&gt;bei Verdacht auf&lt;/span&gt; akut&lt;strong&gt;e&lt;/strong&gt; Appendizitis&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;grammar-prefix&quot;&gt;bei Verdacht auf&lt;/span&gt; akut&lt;strong&gt;en&lt;/strong&gt; Infarkt&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;grammar-prefix&quot;&gt;bei Verdacht auf&lt;/span&gt; akut&lt;strong&gt;es&lt;/strong&gt; Nierenversagen&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;grammar-prefix&quot;&gt;bei Verdacht auf&lt;/span&gt; akut&lt;strong&gt;e&lt;/strong&gt; Komplikationen&lt;/td&gt;&lt;/tr&gt;
              &lt;/tbody&gt;
            &lt;/table&gt;
          &lt;/div&gt;
        &lt;/div&gt;`;
      comparisonSection.appendChild(note);
    }
    if(groupIndex===2){
      const note=document.createElement(&#x27;div&#x27;);
      note.className=&#x27;diagnosis-grammar-note&#x27;;
      note.innerHTML=`
        &lt;div class=&quot;grammar-caption&quot;&gt;Kurzhilfe zum Hergang bei der Aufnahme&lt;/div&gt;
        &lt;div class=&quot;grammar-box&quot;&gt;
          &lt;table&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th style=&quot;width:22%&quot;&gt;Form&lt;/th&gt;&lt;th&gt;Standardform&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Aktiv&lt;/strong&gt;&lt;br&gt;Selbstvorstellung&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;&lt;strong&gt;Der Patient stellte sich&lt;/strong&gt; ... &lt;strong&gt;in unserer Notaufnahme vor.&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Aktiv&lt;/strong&gt;&lt;br&gt;Ambulanz&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;&lt;strong&gt;Der Patient stellte sich&lt;/strong&gt; ... &lt;strong&gt;in unserer&lt;/strong&gt; Ambulanz &lt;strong&gt;vor.&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Passiv&lt;/strong&gt;&lt;br&gt;Rettungsdienst&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;&lt;strong&gt;Der Patient wurde&lt;/strong&gt; durch den Rettungsdienst &lt;strong&gt;in unserer Notaufnahme vorgestellt.&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Passiv&lt;/strong&gt;&lt;br&gt;elektive Aufnahme&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;&lt;strong&gt;Der Patient wurde&lt;/strong&gt; elektiv stationär &lt;strong&gt;aufgenommen.&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;`;
      comparisonSection.appendChild(note);
    }
    if(groupIndex===3){
      const note=document.createElement(&#x27;div&#x27;);
      note.className=&#x27;diagnosis-grammar-note&#x27;;
      note.innerHTML=`
        &lt;div class=&quot;grammar-caption&quot;&gt;Kurzhilfe zur Hauptsymptomatik und Anamnese&lt;/div&gt;
        &lt;div class=&quot;grammar-box&quot;&gt;
          &lt;table&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Satzmuster&lt;/th&gt;&lt;th style=&quot;width:28%&quot;&gt;Hinweis&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;&lt;strong&gt;Zunächst berichtete er/sie über&lt;/strong&gt; …&lt;/td&gt;&lt;td&gt;&lt;code&gt;über + Akk.&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;&lt;strong&gt;seit&lt;/strong&gt; zwei Tagen &lt;strong&gt;bestehende/zunehmende&lt;/strong&gt; Beschwerden&lt;/td&gt;&lt;td&gt;&lt;code&gt;seit + Dat.&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;plötzlich/akut &lt;strong&gt;aufgetretene&lt;/strong&gt; Beschwerden&lt;/td&gt;&lt;td&gt;Beginn&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;&lt;strong&gt;Zudem/Darüber hinaus gab er/sie an, dass&lt;/strong&gt; …&lt;/td&gt;&lt;td&gt;Konjunktiv I&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;&lt;strong&gt;Ferner klagte er/sie über&lt;/strong&gt; …&lt;/td&gt;&lt;td&gt;&lt;code&gt;über + Akk.&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;… bei Vorstellung &lt;strong&gt;weiterhin bestünden.&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;weiterhin vorhanden&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;er/sie aktuell &lt;strong&gt;schmerzfrei sei.&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;aktuell nicht vorhanden&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;Eine Synkope &lt;strong&gt;wurde verneint.&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Singular&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;Fieber und Gewichtsabnahme &lt;strong&gt;wurden verneint.&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Plural&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;&lt;strong&gt;Dabei habe er/sie&lt;/strong&gt; … erlitten.&lt;/td&gt;&lt;td&gt;Unfallfolge&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;`;

    }
    if(groupIndex===4){
      const note=document.createElement(&#x27;div&#x27;);
      note.className=&#x27;diagnosis-grammar-note&#x27;;
      note.innerHTML=`
        &lt;div class=&quot;grammar-caption&quot;&gt;Kurzhilfe zu Vorerkrankungen&lt;/div&gt;
        &lt;div class=&quot;grammar-box&quot;&gt;
          &lt;table&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Satzmuster&lt;/th&gt;&lt;th style=&quot;width:28%&quot;&gt;Hinweis&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;&lt;strong&gt;An Vorerkrankungen sei&lt;/strong&gt; … &lt;strong&gt;bekannt.&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Singular&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;&lt;strong&gt;An Vorerkrankungen seien&lt;/strong&gt; … &lt;strong&gt;bekannt.&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Plural&lt;/td&gt;&lt;/tr&gt;

  function genderMarkedParts(text,gender,patientIdentity){
    const parts=text.split(/(\s+)/);
    const words=[];
    parts.forEach((part,partIndex)=&gt;{
      if(/^\s+$/.test(part)) return;
      const token=part
        .replace(/^[^A-Za-zÄÖÜäöüß-]+/,&#x27;&#x27;)
        .replace(/[^A-Za-zÄÖÜäöüß-]+$/,&#x27;&#x27;);
      if(token) words.push({partIndex,token,lower:token.toLocaleLowerCase(&#x27;de-DE&#x27;)});
    });

    const marked=new Set();
    const femaleWords=new Set([
      &#x27;sie&#x27;,&#x27;ihr&#x27;,&#x27;ihre&#x27;,&#x27;ihren&#x27;,&#x27;ihrem&#x27;,&#x27;ihrer&#x27;,&#x27;ihres&#x27;,
      &#x27;patientin&#x27;,&#x27;patientinnen&#x27;,&#x27;rentnerin&#x27;,&#x27;nichtraucherin&#x27;,&#x27;studentin&#x27;,
      &#x27;raucherin&#x27;,&#x27;büroangestellte&#x27;,&#x27;verkäuferin&#x27;,&#x27;yogalehrerin&#x27;,&#x27;angestellte&#x27;,
      &#x27;teilzeitbeschäftigte&#x27;
    ]);
    const maleWords=new Set([
      &#x27;er&#x27;,&#x27;ihn&#x27;,&#x27;ihm&#x27;,&#x27;seine&#x27;,&#x27;seinen&#x27;,&#x27;seinem&#x27;,&#x27;seiner&#x27;,&#x27;seines&#x27;,
      &#x27;patient&#x27;,&#x27;patienten&#x27;,&#x27;rentner&#x27;,&#x27;nichtraucher&#x27;,&#x27;angestellter&#x27;,
      &#x27;landschaftsgärtner&#x27;,&#x27;büroangestellter&#x27;,&#x27;kfz-mechatroniker&#x27;,&#x27;kraftfahrer&#x27;,
      &#x27;selbstständiger&#x27;,&#x27;malermeister&#x27;,&#x27;kaufmännischer&#x27;,&#x27;informatiker&#x27;,&#x27;bauarbeiter&#x27;
    ]);
    const singleWords=gender===&#x27;female&#x27;?femaleWords:maleWords;
    words.forEach(word=&gt;{
      if(singleWords.has(word.lower)) marked.add(word.partIndex);
    });

    const patientNouns=gender===&#x27;female&#x27;?new Set([&#x27;patientin&#x27;,&#x27;patientinnen&#x27;]):new Set([&#x27;patient&#x27;,&#x27;patienten&#x27;]);
    const contextWords=gender===&#x27;female&#x27;
      ?new Set([&#x27;die&#x27;,&#x27;der&#x27;,&#x27;eine&#x27;,&#x27;einer&#x27;,&#x27;neue&#x27;,&#x27;neuen&#x27;,&#x27;neuer&#x27;,&#x27;weibliche&#x27;,&#x27;weiblichen&#x27;])
      :new Set([&#x27;der&#x27;,&#x27;dem&#x27;,&#x27;den&#x27;,&#x27;ein&#x27;,&#x27;einen&#x27;,&#x27;einem&#x27;,&#x27;neue&#x27;,&#x27;neuen&#x27;,&#x27;neuer&#x27;,&#x27;neuem&#x27;,&#x27;männliche&#x27;,&#x27;männlichen&#x27;]);
    words.forEach((word,index)=&gt;{
      if(!patientNouns.has(word.lower)) return;
      marked.add(word.partIndex);
      for(let offset=1;offset&lt;=3&amp;&amp;index-offset&gt;=0;offset+=1){
        const previous=words[index-offset];
        if(/jährig(?:e|en|er|em|es)?$/.test(previous.lower)){
          continue;
        }
        if(contextWords.has(previous.lower)){
          marked.add(previous.partIndex);
        }else{
          break;
        }
      }
    });

    if(patientIdentity){
      const titles=gender===&#x27;female&#x27;?new Set([&#x27;frau&#x27;]):new Set([&#x27;herr&#x27;,&#x27;herrn&#x27;]);
      words.forEach(word=&gt;{
        if(titles.has(word.lower)) marked.add(word.partIndex);
      });
    }
    return {parts,marked};
  }

  function appendRenderedWord(target,text,className=&#x27;&#x27;,normalWeight=false){
    const word=document.createElement(&#x27;span&#x27;);
    word.className=&#x27;word&#x27;;
    if(className) word.classList.add(className);
    if(normalWeight) word.classList.add(&#x27;age-number&#x27;);
    let showInitial=true;
    for(const char of text){
      const isAlphaNumeric=/[A-Za-zÄÖÜäöüß0-9]/.test(char);
      const piece=document.createElement(&#x27;span&#x27;);
      if(!isAlphaNumeric){
        piece.className=&#x27;punctuation&#x27;;
        piece.textContent=char;
        showInitial=true;
      }else if(showInitial){
        piece.className=&#x27;first-letter&#x27;;
        piece.textContent=char;
        showInitial=false;
      }else{
        piece.className=&#x27;hidden-part&#x27;;
        piece.textContent=char;
      }
      word.appendChild(piece);
    }
    target.appendChild(word);
  }

  function renderLearnItem(li){
    if(li.querySelector(&#x27;:scope &gt; .rendered&#x27;)) return;
    const genderContainer=li.closest(&#x27;.case,.comparison-case-entry&#x27;);
    const gender=genderContainer?.dataset.patientGender||&#x27;&#x27;;
    const patientIdentity=rowKey(li.closest(&#x27;.case-row&#x27;))===&#x27;(Verdachts-)Diagnose/Leitsymptom / Name, Alter&#x27;;
    const segments=Array.from(li.childNodes).map(node=&gt;({
      text:node.textContent,
      bold:node.nodeType===Node.ELEMENT_NODE&amp;&amp;node.tagName===&#x27;STRONG&#x27;,
      lineBreak:node.nodeType===Node.ELEMENT_NODE&amp;&amp;node.tagName===&#x27;BR&#x27;
    }));
    if(!segments.some(segment=&gt;segment.lineBreak||segment.text.trim())) return;
    li.textContent=&#x27;&#x27;;
    const span=document.createElement(&#x27;span&#x27;);
    span.className=&#x27;rendered&#x27;;
    segments.forEach(segment=&gt;{
      if(segment.lineBreak){
        span.appendChild(document.createElement(&#x27;br&#x27;));

  const simulationPrompt = `Ich gebe Ihnen gleich ein Patienteninformationsblatt für eine FaMed-Patientenvorstellung vor. Übernehmen Sie die Rolle der Chefärztin bzw. des Chefarztes in der angegebenen Gesprächssituation. Ich übernehme die Rolle des Stationsarztes bzw. der Stationsärztin und stelle Ihnen den Fall vor.

Bleiben Sie während der gesamten Simulation konsequent in der Chefarztrolle. Hören Sie meiner Patientenvorstellung aufmerksam zu. Geben Sie Informationen aus dem Patienteninformationsblatt nicht von sich aus preis und helfen Sie mir nicht bei der Strukturierung der Vorstellung.

Die Patientenvorstellung soll sich an der FaMed-Struktur orientieren: Name und Alter, Hauptsymptomatik, Anamnese einschließlich Vorerkrankungen und Risikofaktoren&lt;br&gt;&lt;strong&gt;sowie&lt;/strong&gt;&lt;br&gt;gegebenenfalls Sozial- und Familienanamnese, bisherige Diagnostik mit körperlicher Untersuchung, wichtigen Laborwerten und apparativen Untersuchungen, Medikation&lt;br&gt;&lt;strong&gt;sowie&lt;/strong&gt;&lt;br&gt;stationärer Verlauf und Procedere.

  function cleanText(text){

  function leftCaseToMarkdown(section){
    const lines=[];
    const title=section.querySelector(&#x27;:scope &gt; h2&#x27;);
    if(title) lines.push(&#x27;# &#x27;+cleanText(title.textContent),&#x27;&#x27;);

    const card=section.querySelector(&#x27;:scope &gt; .case-card&#x27;);
    if(!card) return lines.join(&#x27;\n&#x27;).trim();

    Array.from(card.children).forEach(child=&gt;{
      if(child.classList &amp;&amp; child.classList.contains(&#x27;case-group-title&#x27;)){
        const text=cleanText(child.textContent);
        if(text) lines.push(&#x27;## &#x27;+text,&#x27;&#x27;);
        return;

      if(!(child.classList &amp;&amp; child.classList.contains(&#x27;case-row&#x27;))) return;
      const left=child.querySelector(&#x27;:scope &gt; .case-col-left&#x27;);
      if(!left) return;
      const heading=left.querySelector(&#x27;:scope &gt; h3&#x27;);
      if(heading) lines.push(&#x27;## &#x27;+cleanText(heading.textContent),&#x27;&#x27;);
      const items=left.querySelectorAll(&#x27;:scope &gt; ul &gt; li&#x27;);
      items.forEach(li=&gt;{
        const text=cleanText(li.textContent);
        if(text) lines.push(&#x27;- &#x27;+text);
      });
      if(items.length) lines.push(&#x27;&#x27;);
      Array.from(left.children).forEach(el=&gt;{
        if(el.tagName===&#x27;P&#x27;){
          const text=cleanText(el.textContent);
          if(text) lines.push(text,&#x27;&#x27;);
        }
      });
    });

    return lines.join(&#x27;\n&#x27;).replace(/\n{3,}/g,&#x27;\n\n&#x27;).trim();
  }

  async function copySimulationCase(){

function genderMarkedParts(text,gender,patientIdentity){
  const parts=text.split(/(\s+)/),words=[];parts.forEach((part,partIndex)=&gt;{if(/^\s+$/.test(part))return;const token=part.replace(/^[^A-Za-zÄÖÜäöüß-]+/,&#x27;&#x27;).replace(/[^A-Za-zÄÖÜäöüß-]+$/,&#x27;&#x27;);if(token)words.push({partIndex,lower:token.toLocaleLowerCase(&#x27;de-DE&#x27;)})});

  words.forEach(word=&gt;{if(single.has(word.lower))marked.add(word.partIndex)});
  const patientNouns=gender===&#x27;female&#x27;?new Set([&#x27;patientin&#x27;,&#x27;patientinnen&#x27;]):new Set([&#x27;patient&#x27;,&#x27;patienten&#x27;]),context=gender===&#x27;female&#x27;?new Set([&#x27;die&#x27;,&#x27;der&#x27;,&#x27;eine&#x27;,&#x27;einer&#x27;]):new Set([&#x27;der&#x27;,&#x27;dem&#x27;,&#x27;den&#x27;,&#x27;ein&#x27;,&#x27;einen&#x27;,&#x27;einem&#x27;]);
  words.forEach((word,index)=&gt;{if(!patientNouns.has(word.lower))return;marked.add(word.partIndex);for(let offset=1;offset&lt;=3&amp;&amp;index-offset&gt;=0;offset++){const previous=words[index-offset];if(/jährig(?:e|en|er|em|es)?$/.test(previous.lower))continue;if(context.has(previous.lower))marked.add(previous.partIndex);else break}});
  if(patientIdentity){const titles=gender===&#x27;female&#x27;?new Set([&#x27;frau&#x27;]):new Set([&#x27;herr&#x27;,&#x27;herrn&#x27;]);words.forEach((word,index)=&gt;{if(titles.has(word.lower))marked.add(word.partIndex);const next=words[index+1];if(next&amp;&amp;next.lower===&#x27;sich&#x27;&amp;&amp;((gender===&#x27;female&#x27;&amp;&amp;word.lower===&#x27;die&#x27;)||(gender===&#x27;male&#x27;&amp;&amp;word.lower===&#x27;der&#x27;)))marked.add(word.partIndex)})}
  return{parts,marked};
}
function appendRenderedWord(target,text,className=&#x27;&#x27;,normalWeight=false){
  const word=document.createElement(&#x27;span&#x27;);word.className=&#x27;word&#x27;;if(className)word.classList.add(className);if(normalWeight)word.classList.add(&#x27;age-number&#x27;);let first=true;
  for(const char of text){const alpha=/[A-Za-zÄÖÜäöüß0-9]/.test(char),piece=document.createElement(&#x27;span&#x27;);if(!alpha){piece.className=&#x27;punctuation&#x27;;piece.textContent=char;first=true}else if(first){piece.className=&#x27;first-letter&#x27;;piece.textContent=char;first=false}else{piece.className=&#x27;hidden-part&#x27;;piece.textContent=char}word.appendChild(piece)}target.appendChild(word);
}
function renderLearnItem(li){
  if(li.querySelector(&#x27;:scope&gt;.rendered&#x27;))return;const container=li.closest(&#x27;.case,.comparison-case-entry&#x27;),gender=container?.dataset.patientGender||&#x27;&#x27;,identity=li.closest(&#x27;.brief-section&#x27;)?.dataset.section===&#x27;vorstellung&#x27;;
  const segments=Array.from(li.childNodes).map(node=&gt;({text:node.textContent,bold:node.nodeType===Node.ELEMENT_NODE&amp;&amp;node.tagName===&#x27;STRONG&#x27;}));li.textContent=&#x27;&#x27;;const rendered=document.createElement(&#x27;span&#x27;);rendered.className=&#x27;rendered&#x27;;
  segments.forEach(segment=&gt;{const target=segment.bold?document.createElement(&#x27;strong&#x27;):rendered;if(segment.bold){target.className=&#x27;template-strong&#x27;;rendered.appendChild(target)}const result=genderMarkedParts(segment.text,gender,identity);result.parts.forEach((part,index)=&gt;{if(/^\s+$/.test(part)){target.appendChild(document.createTextNode(part));return}const age=part.match(/^(.+?)(-?jährig(?:e|en|er|em|es)?)([^A-Za-zÄÖÜäöüß-]*)$/i);if(identity&amp;&amp;age&amp;&amp;gender){appendRenderedWord(target,age[1],&#x27;&#x27;,true);appendRenderedWord(target,age[2]+age[3],&#x27;patient-&#x27;+gender);return}appendRenderedWord(target,part,result.marked.has(index)?&#x27;patient-&#x27;+gender:&#x27;&#x27;)})});li.appendChild(rendered);

<script>
(function(){

  }
  buttons.forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));
  let saved=''; try{saved=localStorage.getItem('fsp-integrated-tab')||''}catch(e){}

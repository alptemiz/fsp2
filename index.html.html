&lt;h2&gt;1. Begrüßung und Personalien&lt;/h2&gt;
&lt;ul&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Guten Tag. Mein Name ist Temiz und ich bin Allgemeinarzt.&lt;/template&gt;&lt;/li&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Bevor wir zu Ihren aktuellen Beschwerden kommen, möchte ich zunächst einige Angaben zu Ihrer Person erfragen.&lt;/template&gt;&lt;/li&gt;
  &lt;ul&gt;
    &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Wie lautet Ihr vollständiger Name?&lt;/template&gt;&lt;/li&gt;
    &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Wie alt sind Sie beziehungsweise wann sind Sie geboren?&lt;/template&gt;&lt;/li&gt;
    &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Wie groß und wie schwer sind Sie?&lt;/template&gt;&lt;/li&gt;
  &lt;/ul&gt;
&lt;/ul&gt;

&lt;h2&gt;2. Aktuelle Beschwerden&lt;/h2&gt;
&lt;div class=&quot;flow-card&quot;&gt;
&lt;h3&gt;Einstieg und Verlauf&lt;/h3&gt;
&lt;ul&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Was führt Sie heute zu mir?&lt;/template&gt;&lt;/li&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Seit wann bestehen die Beschwerden?&lt;/template&gt;&lt;/li&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Haben die Beschwerden plötzlich oder allmählich begonnen?&lt;/template&gt;&lt;/li&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Sind die Beschwerden seitdem besser, schlimmer oder gleich geblieben?&lt;/template&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;

&lt;div class=&quot;flow-card&quot;&gt;
&lt;h3&gt;Husten und Atmung&lt;/h3&gt;
&lt;ul&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Ist der Husten trocken oder haben Sie Auswurf?&lt;/template&gt;&lt;/li&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Haben Sie zusätzlich ein Engegefühl in der Brust?&lt;/template&gt;&lt;/li&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Haben Sie Atemnot bemerkt?&lt;/template&gt;&lt;/li&gt;
  &lt;li class=&quot;learn-item masked&quot; data-bold=&quot;ein Pfeifen||Giemen||?&quot;&gt;&lt;template&gt;Haben Sie beim Atmen ein Pfeifen oder Giemen bemerkt?&lt;/template&gt;&lt;/li&gt;
  &lt;li class=&quot;learn-item masked&quot; data-bold=&quot;täglich||nur an einzelnen Tagen?&quot;&gt;&lt;template&gt;Wie oft haben Sie diese Beschwerden ungefähr, täglich oder nur an einzelnen Tagen?&lt;/template&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;

&lt;div class=&quot;flow-card&quot;&gt;
&lt;h3&gt;Nacht, Belastung und Auslöser&lt;/h3&gt;
&lt;ul&gt;
  &lt;li class=&quot;learn-item masked&quot; data-bold=&quot;Treten||auch nachts auf||wachen Sie deswegen auf&quot;&gt;&lt;template&gt;Treten die Beschwerden auch nachts auf oder wachen Sie deswegen auf?&lt;/template&gt;&lt;/li&gt;
  &lt;ul&gt;
    &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Wie oft passiert das ungefähr?&lt;/template&gt;&lt;/li&gt;
  &lt;/ul&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Bekommen Sie bei körperlicher Belastung, zum Beispiel beim Treppensteigen, Husten oder Atemnot?&lt;/template&gt;&lt;/li&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Gibt es bestimmte Situationen oder Auslöser, bei denen die Beschwerden stärker werden?&lt;/template&gt;&lt;/li&gt;
  &lt;ul&gt;
    &lt;li class=&quot;learn-item masked&quot; data-bold=&quot;bei Staub||beim Staubsaugen&quot;&gt;&lt;template&gt;Werden die Beschwerden bei Staub oder beim Staubsaugen stärker?&lt;/template&gt;&lt;/li&gt;
    &lt;li class=&quot;learn-item masked&quot; data-bold=&quot;bei Kontakt mit Pollen||Tieren verstärkt auf&quot;&gt;&lt;template&gt;Treten die Beschwerden bei Kontakt mit Pollen oder Tieren verstärkt auf?&lt;/template&gt;&lt;/li&gt;
    &lt;li class=&quot;learn-item masked&quot; data-bold=&quot;in Ihrer Wohnung stärker als außerhalb&quot;&gt;&lt;template&gt;Sind die Beschwerden in Ihrer Wohnung stärker als außerhalb?&lt;/template&gt;&lt;/li&gt;
  &lt;/ul&gt;
&lt;/ul&gt;
&lt;/div&gt;

&lt;div class=&quot;flow-card&quot;&gt;
&lt;h3&gt;Berufsbezug&lt;/h3&gt;
&lt;ul&gt;
  &lt;li class=&quot;learn-item masked&quot; data-bold=&quot;beruflich&quot;&gt;&lt;template&gt;Was machen Sie beruflich?&lt;/template&gt;&lt;/li&gt;
  &lt;li class=&quot;learn-item masked&quot; data-bold=&quot;Kontakt mit Staub&quot;&gt;&lt;template&gt;Haben Sie bei der Arbeit Kontakt mit Staub oder anderen Stoffen?&lt;/template&gt;&lt;/li&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Werden die Beschwerden an arbeitsfreien Tagen oder im Urlaub besser?&lt;/template&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;

&lt;div class=&quot;flow-card&quot;&gt;
&lt;h3&gt;Begleitsymptome und aktueller Zustand&lt;/h3&gt;
&lt;ul&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Haben Sie beim Husten irgendwann Blut bemerkt?&lt;/template&gt;&lt;/li&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Haben Sie Fieber bemerkt?&lt;/template&gt;&lt;/li&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Haben Sie nachts ungewöhnlich stark geschwitzt?&lt;/template&gt;&lt;/li&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Hat sich Ihr Appetit verändert?&lt;/template&gt;&lt;/li&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Haben Sie ungewollt Gewicht verloren?&lt;/template&gt;&lt;/li&gt;
  &lt;li class=&quot;learn-item masked&quot; data-bold=&quot;Moment&quot;&gt;&lt;template&gt;Haben Sie im Moment Husten, Brustenge oder Atemnot?&lt;/template&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;

&lt;div class=&quot;flow-card&quot;&gt;
&lt;h3&gt;Bisheriges Vorgehen und frühere Episoden&lt;/h3&gt;
&lt;ul&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Haben Sie etwas gegen die Beschwerden eingenommen oder unternommen?&lt;/template&gt;&lt;/li&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Waren Sie deswegen bereits beim Arzt?&lt;/template&gt;&lt;/li&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Hatten Sie solche Beschwerden früher schon einmal?&lt;/template&gt;&lt;/li&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Haben Sie noch weitere Beschwerden oder etwas anderes Wichtiges bemerkt?&lt;/template&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;

&lt;h2&gt;3. Zwischenzusammenfassung&lt;/h2&gt;
&lt;ul&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Bevor ich weitere Fragen stelle, möchte ich kurz zusammenfassen, was ich bisher verstanden habe.&lt;/template&gt;&lt;/li&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Sie berichten über trockenen Husten und ein Engegefühl in der Brust seit mehreren Wochen.&lt;/template&gt;&lt;/li&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Die Beschwerden treten besonders bei Staubkontakt auf, sind in Ihrer Wohnung stärker und kommen teilweise auch nachts sowie bei Belastung vor.&lt;/template&gt;&lt;/li&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Aktuell haben Sie keine Beschwerden.&lt;/template&gt;&lt;/li&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Habe ich das so richtig verstanden, oder möchten Sie noch etwas ergänzen oder korrigieren?&lt;/template&gt;&lt;/li&gt;
&lt;/ul&gt;

&lt;h2&gt;4. Vorerkrankungen und Voroperationen&lt;/h2&gt;
&lt;ul&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Dann würde ich Ihnen jetzt gerne einige Fragen zu Ihrer medizinischen Vorgeschichte stellen.&lt;/template&gt;&lt;/li&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Sind bei Ihnen chronische oder andere wichtige Erkrankungen bekannt?&lt;/template&gt;&lt;/li&gt;
  &lt;ul&gt;
    &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Falls Asthma bereits erwähnt wurde: Seit wann ist das Asthma bei Ihnen bekannt?&lt;/template&gt;&lt;/li&gt;
    &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Wurde damals eine Lungenfunktionsprüfung oder ein Allergietest gemacht?&lt;/template&gt;&lt;/li&gt;
    &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Wie wurde das Asthma bisher behandelt?&lt;/template&gt;&lt;/li&gt;
    &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Mussten Sie wegen des Asthmas schon einmal in die Notaufnahme oder ins Krankenhaus?&lt;/template&gt;&lt;/li&gt;
    &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Ist bei Ihnen eine Neurodermitis oder eine andere allergische Erkrankung bekannt?&lt;/template&gt;&lt;/li&gt;
  &lt;/ul&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Wurden Sie schon einmal operiert?&lt;/template&gt;&lt;/li&gt;
&lt;/ul&gt;

&lt;h2&gt;5. Medikamente und Allergien&lt;/h2&gt;
&lt;ul&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Welche Medikamente nehmen Sie regelmäßig oder bei Bedarf ein?&lt;/template&gt;&lt;/li&gt;
  &lt;ul&gt;
    &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Haben Sie aktuell ein Asthmaspray?&lt;/template&gt;&lt;/li&gt;
    &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Falls ja: Wie häufig benutzen Sie es?&lt;/template&gt;&lt;/li&gt;
  &lt;/ul&gt;
  &lt;li class=&quot;learn-item masked&quot;&gt;&lt;template&gt;Sind bei Ihnen Allergien oder Unverträglichkeiten bekannt?&lt;/template&gt;&lt;/li&gt;

&lt;/style&gt;&lt;script&gt;try{if(localStorage.getItem(&#x27;fsp-theme&#x27;)===&#x27;dark&#x27;)document.documentElement.setAttribute(&#x27;data-theme&#x27;,&#x27;dark&#x27;)}catch(e){}&lt;/script&gt;&lt;/head&gt;&lt;body&gt;&lt;header class=&quot;site-header&quot;&gt;&lt;nav aria-label=&quot;Hauptnavigation&quot; class=&quot;site-nav&quot;&gt;&lt;a href=&quot;anamnese.html&quot;&gt;Anamnese&lt;/a&gt;&lt;a href=&quot;anamnese-faelle.html&quot;&gt;Anamnese Fälle&lt;/a&gt;&lt;a class=&quot;active&quot; href=&quot;aufklaerung.html&quot;&gt;Aufklärung&lt;/a&gt;&lt;a href=&quot;aufklaerung-ablauf.html&quot;&gt;Aufklärung Ablauf&lt;/a&gt;&lt;a href=&quot;fallvorstellung.html&quot;&gt;Fallvorstellung&lt;/a&gt;&lt;a href=&quot;arztbrief-faelle.html&quot;&gt;Arztbrief Fälle&lt;/a&gt;&lt;/nav&gt;&lt;/header&gt;&lt;button aria-label=&quot;Theme&quot; class=&quot;theme-toggle&quot; id=&quot;themeToggle&quot;&gt;&lt;span class=&quot;sun&quot;&gt;☀&lt;/span&gt;&lt;span class=&quot;moon&quot;&gt;☾&lt;/span&gt;&lt;/button&gt;&lt;main&gt;&lt;div class=&quot;simulation-copy-tools&quot; id=&quot;simulationCopyTools&quot;&gt;&lt;button id=&quot;copySimulationCaseBtn&quot; type=&quot;button&quot;&gt;Prompt + ausgewählten Fall kopieren&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;mode-switch&quot;&gt;&lt;button class=&quot;active&quot; data-mode=&quot;full&quot;&gt;Vollmodus&lt;/button&gt;&lt;button data-mode=&quot;initial&quot;&gt;Initialen&lt;/button&gt;&lt;button data-mode=&quot;blank&quot;&gt;Blank&lt;/button&gt;&lt;/div&gt;&lt;article class=&quot;document training-case active&quot; id=&quot;case-6&quot;&gt;&lt;h2&gt;MRT mit Kontrastmittel&lt;/h2&gt;&lt;div class=&quot;aligned-training&quot;&gt;&lt;div class=&quot;training-row&quot;&gt;&lt;section class=&quot;training-side case-side&quot;&gt;&lt;div class=&quot;training-section&quot;&gt;&lt;h3&gt;Rolle und Situation&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Ihre Rolle: Radiologe/Radiologin&lt;/li&gt;&lt;li&gt;Situation: Aufklärung über eine MRT-Untersuchung mit Kontrastmittel, die am nächsten Tag stattfinden soll.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;training-section&quot;&gt;&lt;h3&gt;Patienteninformationen&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Herr/Frau Müller&lt;/li&gt;&lt;li&gt;Eingriff: Magnetresonanztomographie (MRT) des Abdomens mit Kontrastmittel&lt;/li&gt;&lt;li&gt;Dauer: ca. 20-30 Minuten&lt;/li&gt;&lt;li&gt;Grund des Eingriffs: Auffälligkeiten bei Sonographie der Leber, weitere Abklärung erforderlich&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;training-side speech-side&quot;&gt;&lt;div class=&quot;training-section&quot;&gt;&lt;h3&gt;Einleitung&lt;/h3&gt;&lt;ul&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Guten Tag. Mein Name ist Temiz. Ich bin Radiologe.&lt;/template&gt;&lt;/li&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Ich möchte heute mit Ihnen über die geplante MRT-Untersuchung des Bauchraums sprechen.&lt;/template&gt;&lt;/li&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Ich erkläre Ihnen, warum die Untersuchung notwendig ist, wie sie abläuft, welche Risiken bestehen und was Sie danach beachten müssen.&lt;/template&gt;&lt;/li&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Wenn etwas unklar ist, können Sie mich jederzeit unterbrechen.&lt;/template&gt;&lt;/li&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Ist das für Sie in Ordnung?&lt;/template&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;training-section&quot;&gt;&lt;h3&gt;Indikation&lt;/h3&gt;&lt;ul&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Bei Ihnen besteht der Verdacht auf eine Erkrankung der Leber.&lt;/template&gt;&lt;/li&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Mit der MRT können wir den Bauchraum und insbesondere die Leber sehr genau darstellen und mögliche Veränderungen erkennen.&lt;/template&gt;&lt;/li&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Dadurch können wir die Diagnose weiter abklären und die weitere Behandlung gezielt planen.&lt;/template&gt;&lt;/li&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Deshalb empfehlen wir Ihnen diese Untersuchung.&lt;/template&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;training-section&quot;&gt;&lt;h3&gt;Dauer&lt;/h3&gt;&lt;ul&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Der Eingriff dauert ungefähr zwanzig bis dreißig Minuten.&lt;/template&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;div class=&quot;training-row&quot;&gt;&lt;section class=&quot;training-side case-side&quot;&gt;&lt;div class=&quot;training-section&quot;&gt;&lt;h3&gt;Ablauf&lt;/h3&gt;&lt;p&gt;Lagerung in Rückenlage auf der MRT-Liege; intravenöse Gabe eines gadoliniumhaltigen Kontrastmittels zur besseren Gewebedarstellung; Durchführung der Bildgebung mit regelmäßigen Atemkommandos (zeitweise Atemanhalten erforderlich); ständiger Kontakt zum medizinischen Personal über Gegensprechanlage.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;training-side speech-side&quot;&gt;&lt;div class=&quot;training-section&quot;&gt;&lt;ul&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Nun möchte ich den Ablauf der Untersuchung erklären.&lt;/template&gt;&lt;/li&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Zunächst liegen Sie auf dem Rücken auf der MRT-Liege.&lt;/template&gt;&lt;/li&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Danach bekommen Sie ein Kontrastmittel über eine Vene. Dadurch können wir das Gewebe besser darstellen.&lt;/template&gt;&lt;/li&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Während der Untersuchung machen wir Bilder vom Bauch. Dabei bitten wir Sie, mehrmals kurz die Luft anzuhalten.&lt;/template&gt;&lt;/li&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Während der gesamten Untersuchung können Sie über eine Gegensprechanlage mit uns sprechen.&lt;/template&gt;&lt;/li&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Das wäre alles zum Ablauf.&lt;/template&gt;&lt;/li&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Als Nächstes möchte ich noch auf einige weitere wichtige Punkte eingehen.&lt;/template&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;div class=&quot;training-row&quot;&gt;&lt;section class=&quot;training-side case-side&quot;&gt;&lt;div class=&quot;training-section&quot;&gt;&lt;h3&gt;Vor-/Begleiterkrankungen und Dauermedikation&lt;/h3&gt;&lt;ul&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;training-side speech-side&quot;&gt;&lt;div class=&quot;training-section&quot;&gt;&lt;ul&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Bei Ihnen sind keine Vorerkrankungen bekannt und Sie nehmen keine Medikamente regelmäßig ein.&lt;/template&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;div class=&quot;training-row&quot;&gt;&lt;section class=&quot;training-side case-side&quot;&gt;&lt;div class=&quot;training-section&quot;&gt;&lt;h3&gt;Allgemeine Risiken&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;a. Allergische Reaktionen auf das Kontrastmittel (z.B. Exanthem, Pruritus)&lt;/li&gt;&lt;li&gt;b. Infektion oder lokale Reizung an der Einstichstelle&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;training-side speech-side&quot;&gt;&lt;div class=&quot;training-section&quot;&gt;&lt;ul&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Wie bei jeder Untersuchung gibt es allgemeine Risiken.&lt;/template&gt;&lt;/li&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Es kann zu allergischen Reaktionen auf das Kontrastmittel kommen, zum Beispiel Hautausschlag oder Juckreiz.&lt;/template&gt;&lt;/li&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Außerdem kann es in seltenen Fällen zu Infektionen oder Reizungen an der Einstichstelle kommen.&lt;/template&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;div class=&quot;training-row&quot;&gt;&lt;section class=&quot;training-side case-side&quot;&gt;&lt;div class=&quot;training-section&quot;&gt;&lt;h3&gt;Spezielle Risiken&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Kontrastmittelanreicherung im Gehirn (gesundheitlich unbedenklich) (Häufigkeit: ca. 1:500.000)&lt;/li&gt;&lt;li&gt;Calor oder Metallgeschmack im Mund nach Kontrastmittelgabe (Häufigkeit: ca. 1:100)&lt;/li&gt;&lt;li&gt;Klaustrophobie (Häufigkeit: ca. 1:500)&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;training-side speech-side&quot;&gt;&lt;div class=&quot;training-section&quot;&gt;&lt;ul&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Darüber hinaus gibt es spezielle Risiken bei dieser Untersuchung.&lt;/template&gt;&lt;/li&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Sehr geringe Mengen des Kontrastmittels können sich im Gehirn ablagern. Nach heutigem Kenntnisstand ist das gesundheitlich unbedenklich.&lt;/template&gt;&lt;ul&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Das betrifft etwa einen von fünfhunderttausend Patienten.&lt;/template&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/li&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Während der Gabe des Kontrastmittels kann ein Wärmegefühl oder ein metallischer Geschmack auftreten.&lt;/template&gt;&lt;ul&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Das betrifft etwa einen von hundert Patienten und ist harmlos.&lt;/template&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/li&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;In der engen Röhre kann ein starkes Engegefühl oder Angst auftreten.&lt;/template&gt;&lt;ul&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Das betrifft etwa einen von fünfhundert Patienten.&lt;/template&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;div class=&quot;training-row&quot;&gt;&lt;section class=&quot;training-side case-side&quot;&gt;&lt;/section&gt;&lt;section class=&quot;training-side speech-side&quot;&gt;&lt;div class=&quot;training-section&quot;&gt;&lt;ul&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Ich weiß, dass diese Risiken beunruhigend klingen können.&lt;/template&gt;&lt;/li&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Das bedeutet jedoch nicht, dass sie bei Ihnen auftreten werden.&lt;/template&gt;&lt;/li&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Wir sind gut vorbereitet, um im Bedarfsfall schnell zu reagieren.&lt;/template&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;div class=&quot;training-row&quot;&gt;&lt;section class=&quot;training-side case-side&quot;&gt;&lt;div class=&quot;training-section&quot;&gt;&lt;h3&gt;Präoperatives / präinterventionelles Vorgehen&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Am Untersuchungstag: Nüchternheit 4 Stunden vor der Untersuchung, Entfernung sämtlicher metallischer Gegenstände (z.B. Schmuck, Prothesen), Überprüfung aktueller Laborwerte, insbesondere der Nierenfunktion (Kreatininwert), Ärzte-Team informieren über Zahnprothesen (zur Vermeidung von Artefakten)&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;training-side speech-side&quot;&gt;&lt;div class=&quot;training-section&quot;&gt;&lt;ul&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Vor der Untersuchung sollten Sie mindestens vier Stunden nichts essen.&lt;/template&gt;&lt;/li&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Bitte entfernen Sie alle metallischen Gegenstände.&lt;/template&gt;&lt;/li&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Informieren Sie uns bitte auch über künstlichen Zahnersatz oder andere Metallteile am oder im Körper.&lt;/template&gt;&lt;/li&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Außerdem prüfen wir vor der Untersuchung Ihre aktuellen Blutwerte, insbesondere die Nierenfunktion.&lt;/template&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;div class=&quot;training-row&quot;&gt;&lt;section class=&quot;training-side case-side&quot;&gt;&lt;div class=&quot;training-section&quot;&gt;&lt;h3&gt;Postoperatives / postinterventionelles Vorgehen&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Unmittelbare Beobachtung hinsichtlich möglicher allergischer Reaktionen, Normale Flüssigkeitszufuhr zur Förderung der Ausscheidung des Kontrastmittels, Ambulante Befundbesprechung mit behandelndem Arzt&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;training-side speech-side&quot;&gt;&lt;div class=&quot;training-section&quot;&gt;&lt;ul&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Nach der Untersuchung werden Sie zunächst kurz beobachtet, um mögliche Reaktionen früh zu erkennen.&lt;/template&gt;&lt;/li&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Danach können Sie in der Regel wieder normal essen und trinken.&lt;/template&gt;&lt;/li&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Trinken Sie anschließend ausreichend, damit das Kontrastmittel ausgeschieden wird.&lt;/template&gt;&lt;/li&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Die Befunde besprechen Sie anschließend ambulant mit Ihrem behandelnden Arzt.&lt;/template&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;div class=&quot;training-row&quot;&gt;&lt;section class=&quot;training-side case-side&quot;&gt;&lt;/section&gt;&lt;section class=&quot;training-side speech-side&quot;&gt;&lt;div class=&quot;training-section&quot;&gt;&lt;ul&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Das wäre soweit alles. Haben Sie noch Fragen?&lt;/template&gt;&lt;/li&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Sind Sie mit der geplanten Untersuchung einverstanden?&lt;/template&gt;&lt;/li&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Dann gebe ich Ihnen jetzt den Aufklärungsbogen zum Durchlesen. Wenn alles verständlich ist, unterschreiben Sie bitte hier.&lt;/template&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;div class=&quot;qa-training-row&quot;&gt;&lt;div class=&quot;qa-table&quot;&gt;&lt;div class=&quot;qa-head&quot;&gt;&lt;div class=&quot;qa-head-cell&quot;&gt;Mögliche Patientenfragen&lt;/div&gt;&lt;div class=&quot;qa-head-cell&quot;&gt;Antworten&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;qa-pair&quot;&gt;&lt;div class=&quot;qa-cell qa-question&quot;&gt;Warum darf ich kein Metall tragen?&lt;/div&gt;&lt;div class=&quot;qa-cell qa-answer&quot;&gt;&lt;ul&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Weil bei der MRT ein starkes Magnetfeld verwendet wird. Metallische Gegenstände können dadurch gefährlich werden oder die Untersuchung stören.&lt;/template&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;qa-pair&quot;&gt;&lt;div class=&quot;qa-cell qa-question&quot;&gt;Tut die Untersuchung weh?&lt;/div&gt;&lt;div class=&quot;qa-cell qa-answer&quot;&gt;&lt;ul&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Nein, die Untersuchung selbst ist schmerzlos. Sie spüren höchstens kurz den Einstich für das Kontrastmittel.&lt;/template&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;qa-pair&quot;&gt;&lt;div class=&quot;qa-cell qa-question&quot;&gt;Was ist das Kontrastmittel?&lt;/div&gt;&lt;div class=&quot;qa-cell qa-answer&quot;&gt;&lt;ul&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Das ist eine Flüssigkeit, die wir über eine Vene geben. Dadurch können wir die Gewebe auf den Bildern besser unterscheiden.&lt;/template&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;qa-pair&quot;&gt;&lt;div class=&quot;qa-cell qa-question&quot;&gt;Was passiert bei Platzangst?&lt;/div&gt;&lt;div class=&quot;qa-cell qa-answer&quot;&gt;&lt;ul&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Wenn Sie starke Platzangst haben, können wir Ihnen bei Bedarf ein Beruhigungsmittel geben.&lt;/template&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;qa-pair&quot;&gt;&lt;div class=&quot;qa-cell qa-question&quot;&gt;Gibt es Alternativen?&lt;/div&gt;&lt;div class=&quot;qa-cell qa-answer&quot;&gt;&lt;ul&gt;&lt;li class=&quot;learn-item&quot;&gt;&lt;template&gt;Ja, zum Beispiel eine CT. Ob diese genauso geeignet ist, hängt aber von der Fragestellung ab.&lt;/template&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;&lt;/main&gt;&lt;script&gt;

 function collectBoldRanges(text){

// AUFKLAERUNG_SIMULATION_COPY_HANDLER
(function() {
  const simulationPrompt = &#x27;Ich gebe Ihnen gleich einen medizinischen Fall für ein Aufklärungsgespräch vor. Übernehmen Sie anschließend die Rolle der Patientin bzw. des Patienten entsprechend diesem Fall.\nAntworten Sie ausschließlich aus Patientensicht. Reagieren Sie auf meine Erklärungen so, wie es eine Patientin bzw. ein Patient in einem realistischen Aufklärungsgespräch tun würde.\nGeben Sie nur Informationen preis, die im Fall angegeben sind oder sich aus dem Gespräch auf natürliche Weise ergeben. Verwenden Sie alltagssprachliche Formulierungen und vermeiden Sie medizinische Fachbegriffe.\nStellen Sie an passenden Stellen realistische Rückfragen, insbesondere wenn etwas unklar, beunruhigend oder für die Entscheidung relevant ist. Fragen Sie zum Beispiel nach dem Ablauf, möglichen Schmerzen, Risiken, Alternativen, der Vorbereitung, dem Verhalten nach dem Eingriff oder danach, was passiert, wenn die Untersuchung oder Behandlung nicht durchgeführt wird. Stellen Sie jedoch nicht mehrere Fragen auf einmal und fragen Sie nichts, was bereits verständlich erklärt wurde.\nBleiben Sie während des gesamten Gesprächs konsequent in der Patientenrolle. Bewerten oder korrigieren Sie meine Aufklärung nicht während der Simulation.\nBeginnen Sie das Gespräch nicht selbst, sondern warten Sie auf meine erste Ansprache.&#x27;;

  function cleanText(text) {
    return text.replace(/\s+/g, &#x27; &#x27;).trim();
  }

  function caseSideToMarkdown(article) {
    const lines = [];
    const title = article.querySelector(&#x27;:scope &gt; h2&#x27;);
    if (title) lines.push(&#x27;# &#x27; + cleanText(title.textContent), &#x27;&#x27;);

    const caseSides = article.querySelectorAll(&#x27;.training-row .case-side&#x27;);

    caseSides.forEach(side =&gt; {
      side.querySelectorAll(&#x27;:scope .training-section&#x27;).forEach(section =&gt; {
        const heading = section.querySelector(&#x27;:scope &gt; h3&#x27;);
        if (heading) lines.push(&#x27;## &#x27; + cleanText(heading.textContent), &#x27;&#x27;);

        Array.from(section.children).forEach(el =&gt; {
          if (el.tagName === &#x27;H3&#x27;) return;

          if (el.tagName === &#x27;P&#x27;) {
            const text = cleanText(el.textContent);
            if (text) lines.push(text, &#x27;&#x27;);
          }

          if (el.tagName === &#x27;UL&#x27;) {
            Array.from(el.children).forEach(li =&gt; {
              if (li.tagName !== &#x27;LI&#x27;) return;
              const text = cleanText(li.textContent);
              if (text) lines.push(&#x27;- &#x27; + text);
            });
            if (el.children.length) lines.push(&#x27;&#x27;);
          }

          if (el.tagName === &#x27;TABLE&#x27;) {
            const rows = Array.from(el.querySelectorAll(&#x27;tr&#x27;));
            rows.forEach((tr, index) =&gt; {
              const cells = Array.from(tr.children).map(cell =&gt; cleanText(cell.textContent));
              if (!cells.length) return;
              lines.push(&#x27;| &#x27; + cells.join(&#x27; | &#x27;) + &#x27; |&#x27;);
              if (index === 0) lines.push(&#x27;| &#x27; + cells.map(() =&gt; &#x27;---&#x27;).join(&#x27; | &#x27;) + &#x27; |&#x27;);
            });
            if (rows.length) lines.push(&#x27;&#x27;);
          }
        });
      });
    });

    const patientQuestions = article.querySelectorAll(&#x27;.qa-pair .qa-question&#x27;);
    if (patientQuestions.length) {
      lines.push(&#x27;## Mögliche Patientenfragen&#x27;, &#x27;&#x27;);
      patientQuestions.forEach(q =&gt; {
        const text = cleanText(q.textContent);
        if (text) lines.push(&#x27;- &#x27; + text);
      });
      lines.push(&#x27;&#x27;);
    }

    return lines.join(&#x27;\n&#x27;).replace(/\n{3,}/g, &#x27;\n\n&#x27;).trim();
  }

  function getActiveCase() {
    if (document.body.classList.contains(&#x27;all-comparison-mode&#x27;)) return null;
    return document.querySelector(&#x27;.training-case.active&#x27;) ||
           Array.from(document.querySelectorAll(&#x27;.training-case&#x27;)).find(el =&gt; getComputedStyle(el).display !== &#x27;none&#x27;) ||
           document.querySelector(&#x27;.training-case&#x27;);
  }

  async function copySimulationCase() {
    const activeCase = getActiveCase();
    if (!activeCase) return;

    const caseMarkdown = caseSideToMarkdown(activeCase);
    const fullText = simulationPrompt + &#x27;\n\n***\n\n&#x27; + caseMarkdown;

    const btn = document.getElementById(&#x27;copySimulationCaseBtn&#x27;);

    try {
      await navigator.clipboard.writeText(fullText);
    } catch (err) {
      const textarea = document.createElement(&#x27;textarea&#x27;);
      textarea.value = fullText;
      textarea.style.position = &#x27;fixed&#x27;;
      textarea.style.left = &#x27;-9999px&#x27;;
      textarea.style.top = &#x27;0&#x27;;
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      document.execCommand(&#x27;copy&#x27;);
      textarea.remove();
    }

    if (btn) {
      const previous = btn.textContent;
      btn.textContent = &#x27;Kopiert&#x27;;
      window.setTimeout(() =&gt; {
        btn.textContent = previous;
      }, 1200);
    }
  }

  document.addEventListener(&#x27;DOMContentLoaded&#x27;, function() {
    const btn = document.getElementById(&#x27;copySimulationCaseBtn&#x27;);
    if (btn) btn.addEventListener(&#x27;click&#x27;, copySimulationCase);
  });
})();

&lt;section class=&quot;case&quot; data-category=&quot;C. Gastroenterologie und Viszeralchirurgie&quot;&gt;
&lt;h2&gt;C7. akute Appendizitis&lt;/h2&gt;
&lt;div class=&quot;case-card&quot;&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;Rahmen&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;Chefarztvisite (Dr. Meier)&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;case-col case-col-right&quot;&gt;
&lt;ul&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Guten Tag&lt;/strong&gt;, Frau Dr. Meier.&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Mein Name ist Temiz und ich bin Stationsarzt.&lt;/strong&gt;&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Ich möchte Ihnen eine neue Patientin vorstellen.&lt;/strong&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;(Verdachts-)Diagnose/Leitsymptom&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;Verdacht auf akute Appendizitis&lt;/li&gt;
&lt;/ul&gt;
&lt;h3&gt;Name, Alter&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;Monika Schneider, 22 Jahre&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;case-col case-col-right&quot;&gt;
&lt;ul&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Es handelt sich um&lt;/strong&gt; Frau Monika Schneider, eine zweiundzwanzig-jährige Patientin bei Verdacht auf akute Appendizitis.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;Hergang bei der Aufnahme&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;Vorstellung fußläufig in Notaufnahme&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;case-col case-col-right&quot;&gt;
&lt;ul&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Die Patientin stellte sich&lt;/strong&gt; fußläufig &lt;strong&gt;in unserer&lt;/strong&gt; Notaufnahme &lt;strong&gt;vor.&lt;/strong&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;Hauptsymptomatik, Anamnese&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;seit 12 Stunden bestehende und zunehmend stärker werdender rechtsseitiger Unterbauchschmerzen&lt;/li&gt;
&lt;li&gt;Übelkeit und Erbrechen&lt;/li&gt;
&lt;li&gt;initial diffuse Bauchschmerzen, Verlagerung in rechten Unterbauch nach ca. 6 Stunden&lt;/li&gt;
&lt;li&gt;Übelkeit, zweimaliges Erbrechen ohne Blutbeimengung&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;case-col case-col-right&quot;&gt;
&lt;ul&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Zunächst berichtete sie über seit&lt;/strong&gt; insgesamt zwölf Stunden &lt;strong&gt;bestehende&lt;/strong&gt;, initial diffuse abdominale Schmerzen.&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Zudem gab sie an, dass&lt;/strong&gt; sich die Schmerzen nach etwa sechs Stunden in den rechten Unterbauch verlagert hätten.&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Darüber hinaus gab sie an, dass die Schmerzen&lt;/strong&gt; an Intensität zunähmen.&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Ferner klagte sie über&lt;/strong&gt; Nausea &lt;strong&gt;sowie&lt;/strong&gt; zweimalige Emesis ohne Blutbeimengung.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;Vorerkrankungen&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;Asthma bronchiale (Erstdiagnose: 2010)&lt;/li&gt;
&lt;li&gt;Laktoseintoleranz (Erstdiagnose: 2015)&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;case-col case-col-right&quot;&gt;
&lt;ul&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;An Vorerkrankungen seien&lt;/strong&gt; ein Asthma bronchiale &lt;strong&gt;mit Erstdiagnose im Jahr&lt;/strong&gt; zweitausendzehn &lt;strong&gt;sowie&lt;/strong&gt; eine Laktoseintoleranz &lt;strong&gt;mit Erstdiagnose im Jahr&lt;/strong&gt; zweitausendfünfzehn &lt;strong&gt;bekannt.&lt;/strong&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;Bisherige Medikation&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;Salbutamol bei Bedarf, gegen Asthma bronchiale&lt;/li&gt;
&lt;li&gt;Lactase-Tabletten bei Bedarf, gegen Laktoseintoleranz&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;case-col case-col-right&quot;&gt;
&lt;ul&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;In Bezug auf die Medikation nehme sie&lt;/strong&gt; Salbutamol bei Bedarf gegen Asthma bronchiale &lt;strong&gt;sowie&lt;/strong&gt; Laktase-Tabletten bei Bedarf gegen die Laktoseintoleranz &lt;strong&gt;ein.&lt;/strong&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;Allergien&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;Penicillin&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;case-col case-col-right&quot;&gt;
&lt;ul&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Es bestehe&lt;/strong&gt; eine Penicillinallergie.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;Risikofaktoren&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;Keine Angabe&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;case-col case-col-right&quot;&gt;
&lt;ul&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Relevante Risikofaktoren seien nicht bekannt.&lt;/strong&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;Sozialanamnese&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;Studentin, wohnhaft allein in eigener Wohnung&lt;/li&gt;
&lt;li&gt;gelegentlicher Alkoholkonsum (ca. 1x/Woche), Nichtraucher&lt;/li&gt;
&lt;li&gt;keine regelmäßige sportliche Aktivität&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;case-col case-col-right&quot;&gt;
&lt;ul&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Sozialanamnestisch sei sie&lt;/strong&gt; Studentin und Nichtraucherin.&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;Sie lebe allein in einer eigenen Wohnung.&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;Sie trinke etwa einmal pro Woche Alkohol.&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;Sie treibe nicht regelmäßig Sport.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;Familienanamnese&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;Mutter: Hypertonie&lt;/li&gt;
&lt;li&gt;Vater: Appendektomie im Alter von 25 Jahren&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;case-col case-col-right&quot;&gt;
&lt;ul&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Familienanamnestisch habe&lt;/strong&gt; die Mutter eine arterielle Hypertonie.&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;Der Vater habe sich mit fünfundzwanzig Jahren einer Appendektomie unterzogen.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;case-group-title&quot;&gt;Bisherige Diagnostik&lt;/div&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;Vitalparameter bei Aufnahme&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;Blutdruck: 125/80 mmHg&lt;/li&gt;
&lt;li&gt;Herzfrequenz: 96/min&lt;/li&gt;
&lt;li&gt;Atemfrequenz: 18/min&lt;/li&gt;
&lt;li&gt;Sättigung (SpO₂): 98 % unter Raumluft&lt;/li&gt;
&lt;li&gt;Temperatur: 38,1 °C (febril)&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;case-col case-col-right&quot;&gt;
&lt;ul&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Bei der Aufnahme wurden folgende Vitalparameter erhoben.&lt;/strong&gt;&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Der Blutdruck betrug&lt;/strong&gt; einhundertfünfundzwanzig zu achtzig &lt;strong&gt;Millimeter Quecksilbersäule.&lt;/strong&gt;&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Die Herzfrequenz lag bei&lt;/strong&gt; sechsundneunzig &lt;strong&gt;Schlägen pro Minute.&lt;/strong&gt;&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Die Atemfrequenz betrug&lt;/strong&gt; achtzehn &lt;strong&gt;pro Minute.&lt;/strong&gt;&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Die Sauerstoffsättigung lag bei&lt;/strong&gt; achtundneunzig &lt;strong&gt;Prozent unter Raumluft.&lt;/strong&gt;&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Die Körpertemperatur betrug&lt;/strong&gt; achtunddreißig Komma eins Grad Celsius und war damit febril.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;Körperliche Untersuchung&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;Unauffällig: Herz, Lunge, Niere, Extremitäten&lt;/li&gt;
&lt;li&gt;Auffällig: Druckschmerz rechter Unterbauch, lokaler Loslassschmerz (McBurney-Punkt), positives Blumberg-Zeichen, leichte Abwehrspannung&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;case-col case-col-right&quot;&gt;
&lt;ul&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Bei der körperlichen Untersuchung zeigten sich&lt;/strong&gt; kardial und pulmonal &lt;strong&gt;sowie&lt;/strong&gt; an den Extremitäten und über beiden Nierenlagern &lt;strong&gt;keine Auffälligkeiten.&lt;/strong&gt;&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Im rechten unteren Abdominalquadranten bestanden&lt;/strong&gt; eine Druckdolenz, ein lokaler Loslassschmerz und eine leichte Abwehrspannung.&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;Das Blumberg-Zeichen &lt;strong&gt;war positiv.&lt;/strong&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;Wichtige Laborwerte&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;Normwertig/unauffällig: Elektrolyte, Kreatinin, Leberenzyme (AST, ALT), Lipase, INR&lt;/li&gt;
&lt;li&gt;Veränderte Laborwerte:&lt;/li&gt;
&lt;li&gt;Leukozyten erhöht (14,2 /nl, Referenzbereich 4-10 /nl)&lt;/li&gt;
&lt;li&gt;CRP erhöht (45 mg/l, Referenzbereich &amp;lt; 5 mg/l)&lt;/li&gt;
&lt;li&gt;Beta-hCG negativ&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;case-col case-col-right&quot;&gt;
&lt;ul&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Laborchemisch waren&lt;/strong&gt; Elektrolyte, Kreatinin, Leberenzyme, Lipase und INR unauffällig.&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;Die Leukozyten waren mit vierzehn Komma zwei pro Nanoliter und das CRP mit fünfundvierzig Milligramm pro Liter erhöht.&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;Das Beta-hCG &lt;strong&gt;war negativ.&lt;/strong&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;Wichtige apparative Untersuchungen&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;Untersuchung: Abdomensonografie&lt;/li&gt;
&lt;li&gt;Verdickung der Appendixwand (Durchmesser ca. 10 mm)&lt;/li&gt;
&lt;li&gt;Umgebung der Appendix zeigt freie Flüssigkeit&lt;/li&gt;
&lt;li&gt;Hinweis auf entzündliche Infiltration im rechten Unterbauch&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;case-col case-col-right&quot;&gt;
&lt;ul&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;In der Abdomensonografie zeigte sich&lt;/strong&gt; eine auf etwa zehn Millimeter verdickte Appendixwand.&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;In der Umgebung der Appendix bestanden freie Flüssigkeit und Hinweise auf eine entzündliche Infiltration im rechten unteren Abdominalquadranten.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;Neu angesetzte/umgestellte Medikation&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;Metamizol 500 mg i.v., bei starken Schmerzen nach Bedarf&lt;/li&gt;
&lt;li&gt;Infusionstherapie mit kristalloiden Lösungen (z.B. Ringer-Laktat) zum Flüssigkeitsausgleich&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;case-col case-col-right&quot;&gt;
&lt;ul&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Aktuell erfolgt folgende Therapie:&lt;/strong&gt;&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;Bei starken Schmerzen erhält die Patientin Metamizol fünfhundert Milligramm intravenös nach Bedarf.&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;Zusätzlich erfolgt zum Flüssigkeitsausgleich eine Infusionstherapie mit einer kristalloiden Lösung, beispielsweise Ringer-Laktat.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;Stationärer Verlauf&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;Aufnahme auf chirurgische Station zur engmaschigen Beobachtung&lt;/li&gt;
&lt;li&gt;Nahrungskarenz, Vorbereitung auf mögliche operative Intervention&lt;/li&gt;
&lt;li&gt;regelmäßige Kontrolle von Vitalparametern, Schmerzsymptomatik und Labordiagnostik&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;case-col case-col-right&quot;&gt;
&lt;ul&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Im bisherigen stationären Verlauf zeigte sich Folgendes:&lt;/strong&gt;&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;Die Patientin wurde zur engmaschigen Beobachtung auf die chirurgische Station aufgenommen.&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;Es besteht Nahrungskarenz und die Vorbereitung auf eine mögliche operative Intervention läuft.&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;Vitalparameter, Schmerzsymptomatik und Laborwerte werden regelmäßig kontrolliert.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;Procedere&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;zeitnahe laparoskopische Appendektomie nach chirurgischer Konsultation&lt;/li&gt;
&lt;li&gt;Je nach Befund:&lt;/li&gt;
&lt;li&gt;ggf. Umstellung auf offene Appendektomie bei Komplikationen oder ausgeprägtem Befund&lt;/li&gt;
&lt;li&gt;Zusätzlich:&lt;/li&gt;
&lt;li&gt;Antibiotikatherapie perioperativ, z.B. Cefuroxim + Metronidazol zur Infektionsprophylaxe&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;

&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Je nach Befund&lt;/strong&gt; &lt;strong&gt;kommt&lt;/strong&gt; gegebenenfalls eine Umstellung auf eine offene Appendektomie bei Komplikationen oder ausgeprägtem Befund &lt;strong&gt;infrage.&lt;/strong&gt;&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Zusätzlich&lt;/strong&gt; ist perioperativ eine Antibiotikatherapie, zum Beispiel mit Cefuroxim und Metronidazol, zur Infektionsprophylaxe &lt;strong&gt;vorgesehen.&lt;/strong&gt;&lt;/li&gt;

&lt;/article&gt;
&lt;/main&gt;
&lt;script&gt;(function(){
  const sel=document.getElementById(&#x27;caseSelect&#x27;);
  const cases=[...document.querySelectorAll(&#x27;.case&#x27;)];

  const allOption=document.createElement(&#x27;option&#x27;);
  allOption.value=&#x27;all&#x27;;
  allOption.textContent=&#x27;Alle Fälle&#x27;;
  sel.appendChild(allOption);

  const optionGroups=new Map();
  cases.forEach((section,i)=&gt;{
    const option=document.createElement(&#x27;option&#x27;);
    option.value=&#x27;c&#x27;+i;
    option.textContent=section.querySelector(&#x27;h2&#x27;).textContent;
    const category=section.dataset.category;
    if(category){
      if(!optionGroups.has(category)){
        const group=document.createElement(&#x27;optgroup&#x27;);
        group.label=category;
        optionGroups.set(category,group);
        sel.appendChild(group);
      }
      optionGroups.get(category).appendChild(option);
    }else{
      sel.appendChild(option);
    }
    section.dataset.v=&#x27;c&#x27;+i;
  });

  function rowKey(row){
    return Array.from(row.querySelectorAll(&#x27;.case-col-left h3&#x27;))
      .map(heading=&gt;heading.textContent.trim())
      .filter(Boolean)
      .join(&#x27; / &#x27;);
  }

  function patientGender(section){
    const diagnosisRow=Array.from(section.querySelectorAll(&#x27;:scope &gt; .case-card &gt; .case-row&#x27;))
      .find(row=&gt;rowKey(row)===&#x27;(Verdachts-)Diagnose/Leitsymptom / Name, Alter&#x27;);
    const text=diagnosisRow?.querySelector(&#x27;.case-col-right&#x27;)?.textContent||&#x27;&#x27;;
    return /\bPatientin\b/.test(text)?&#x27;female&#x27;:&#x27;male&#x27;;
  }
  cases.forEach(section=&gt;{
    section.dataset.patientGender=patientGender(section);
  });

  function formatPatientIntro(section){
    const diagnosisRow=Array.from(section.querySelectorAll(&#x27;:scope &gt; .case-card &gt; .case-row&#x27;))
      .find(row=&gt;rowKey(row)===&#x27;(Verdachts-)Diagnose/Leitsymptom / Name, Alter&#x27;);
    const li=diagnosisRow?.querySelector(&#x27;.case-col-right .learn-item&#x27;);
    const strong=li?.querySelector(&#x27;:scope &gt; strong&#x27;);
    if(!li||!strong) return;
    const tail=Array.from(li.childNodes)
      .filter(node=&gt;node!==strong)
      .map(node=&gt;node.textContent)
      .join(&#x27;&#x27;)
      .trim();
    const firstBreak=tail.indexOf(&#x27;,&#x27;);
    const secondBreak=tail.indexOf(&#x27; mit &#x27;,firstBreak+1);
    if(firstBreak&lt;0||secondBreak&lt;0) return;
    const patientName=tail.slice(0,firstBreak+1).trim();
    const patientDescription=tail.slice(firstBreak+1,secondBreak).trim();
    const diagnosis=tail.slice(secondBreak+1).trim();
    li.replaceChildren(
      strong,
      document.createTextNode(&#x27; &#x27;+patientName),
      document.createElement(&#x27;br&#x27;),
      document.createTextNode(&#x27;\u00a0\u00a0\u00a0\u00a0&#x27;+patientDescription),
      document.createElement(&#x27;br&#x27;),
      document.createTextNode(&#x27;\u00a0\u00a0\u00a0\u00a0&#x27;+diagnosis)
    );
  }
  cases.forEach(formatPatientIntro);

  const comparisonGroups=[
    {label:&#x27;1. Rahmen&#x27;,keys:[&#x27;Rahmen&#x27;]},
    {label:&#x27;2. Diagnose, Name und Alter&#x27;,keys:[&#x27;(Verdachts-)Diagnose/Leitsymptom / Name, Alter&#x27;]},
    {label:&#x27;3. Hergang bei der Aufnahme&#x27;,keys:[&#x27;Hergang bei der Aufnahme&#x27;]},
    {label:&#x27;4. Hauptsymptomatik, Anamnese&#x27;,keys:[&#x27;Hauptsymptomatik, Anamnese&#x27;]},
    {label:&#x27;5. Vorerkrankungen&#x27;,keys:[&#x27;Vorerkrankungen&#x27;]},
    {label:&#x27;6. Bisherige Medikation&#x27;,keys:[&#x27;Bisherige Medikation&#x27;]},
    {label:&#x27;7. Allergien&#x27;,keys:[&#x27;Allergien&#x27;]},
    {label:&#x27;8. Risikofaktoren&#x27;,keys:[&#x27;Risikofaktoren&#x27;]},
    {label:&#x27;9. Sozialanamnese&#x27;,keys:[&#x27;Sozialanamnese&#x27;]},
    {label:&#x27;10. Familienanamnese&#x27;,keys:[&#x27;Familienanamnese&#x27;]},
    {label:&#x27;11. Vitalparameter&#x27;,keys:[&#x27;Vitalparameter bei Aufnahme&#x27;]},
    {label:&#x27;12. Körperliche Untersuchung&#x27;,keys:[&#x27;Körperliche Untersuchung&#x27;]},
    {label:&#x27;13. Labor und apparative Diagnostik&#x27;,keys:[&#x27;Wichtige Laborwerte&#x27;,&#x27;Wichtige apparative Untersuchungen&#x27;]},
    {label:&#x27;14. Therapie&#x27;,keys:[&#x27;Neu angesetzte/umgestellte Medikation&#x27;]},
    {label:&#x27;15. Stationärer Verlauf&#x27;,keys:[&#x27;Stationärer Verlauf&#x27;]},
    {label:&#x27;16. Procedere&#x27;,keys:[&#x27;Procedere&#x27;]}
  ];

  const comparisonControl=document.createElement(&#x27;div&#x27;);
  comparisonControl.className=&#x27;comparison-select-control floating-control&#x27;;
  const comparisonLabel=document.createElement(&#x27;label&#x27;);
  comparisonLabel.htmlFor=&#x27;comparisonSectionSelect&#x27;;
  comparisonLabel.textContent=&#x27;Abschnitt auswählen:&#x27;;

  comparisonSelect.id=&#x27;comparisonSectionSelect&#x27;;
  comparisonGroups.forEach((group,index)=&gt;{
    const option=document.createElement(&#x27;option&#x27;);
    option.value=&#x27;g&#x27;+index;
    option.textContent=group.label;

  comparisonControl.append(comparisonLabel,comparisonSelect);
  document.body.appendChild(comparisonControl);

  const missingMessages={
    &#x27;Vorerkrankungen&#x27;:&#x27;Relevante Vorerkrankungen seien nicht bekannt.&#x27;,

    &#x27;Sozialanamnese&#x27;:&#x27;Zur Sozialanamnese lägen keine Angaben vor.&#x27;,
    &#x27;Familienanamnese&#x27;:&#x27;Zur Familienanamnese lägen keine Angaben vor.&#x27;,
    &#x27;Wichtige apparative Untersuchungen&#x27;:&#x27;Zu apparativen Untersuchungen lägen keine Angaben vor.&#x27;,
    &#x27;Neu angesetzte/umgestellte Medikation&#x27;:&#x27;Zu einer neu angesetzten oder umgestellten Medikation lägen keine Angaben vor.&#x27;
  };

  function createMissingRow(key){
    const row=document.createElement(&#x27;div&#x27;);
    row.className=&#x27;case-row&#x27;;
    const left=document.createElement(&#x27;div&#x27;);
    left.className=&#x27;case-col case-col-left&#x27;;
    const heading=document.createElement(&#x27;h3&#x27;);
    heading.textContent=key;
    const leftList=document.createElement(&#x27;ul&#x27;);
    const leftItem=document.createElement(&#x27;li&#x27;);
    leftItem.textContent=&#x27;keine Angaben dokumentiert&#x27;;
    leftList.appendChild(leftItem);
    left.append(heading,leftList);
    const right=document.createElement(&#x27;div&#x27;);
    right.className=&#x27;case-col case-col-right&#x27;;
    const rightList=document.createElement(&#x27;ul&#x27;);
    const rightItem=document.createElement(&#x27;li&#x27;);
    rightItem.className=&#x27;learn-item&#x27;;
    const sentence=document.createElement(&#x27;strong&#x27;);
    sentence.textContent=missingMessages[key]||&#x27;Zu diesem Abschnitt lägen keine Angaben vor.&#x27;;
    rightItem.appendChild(sentence);
    rightList.appendChild(rightItem);
    right.appendChild(rightList);
    row.append(left,right);
    return row;
  }

  const allView=document.createElement(&#x27;article&#x27;);
  allView.className=&#x27;comparison-view&#x27;;
  allView.id=&#x27;allCasesComparison&#x27;;
  comparisonGroups.forEach((group,groupIndex)=&gt;{
    const comparisonSection=document.createElement(&#x27;section&#x27;);
    comparisonSection.className=&#x27;comparison-section&#x27;;
    if(group.keys.length===1) comparisonSection.classList.add(&#x27;single-key-section&#x27;);
    comparisonSection.dataset.group=&#x27;g&#x27;+groupIndex;
    const card=document.createElement(&#x27;div&#x27;);
    card.className=&#x27;case-card&#x27;;
    if(groupIndex===1){
      const note=document.createElement(&#x27;div&#x27;);
      note.className=&#x27;diagnosis-grammar-note&#x27;;
      note.innerHTML=`
        &lt;div class=&quot;grammar-caption&quot;&gt;Kurzhilfe zur Diagnoseformulierung&lt;/div&gt;
        &lt;div class=&quot;grammar-box grammar-box-article&quot;&gt;
          &lt;h4&gt;Artikel&lt;/h4&gt;
          &lt;table&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;die&lt;/th&gt;&lt;th&gt;der&lt;/th&gt;&lt;th&gt;das&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;-itis&lt;/td&gt;&lt;td&gt;-infarkt&lt;/td&gt;&lt;td&gt;-versagen&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;-ie&lt;/td&gt;&lt;td&gt;-schock&lt;/td&gt;&lt;td&gt;-flimmern&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;-ose&lt;/td&gt;&lt;td&gt;-schwindel&lt;/td&gt;&lt;td&gt;-trauma&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;-ung&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;Asthma&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;-ur&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;
        &lt;div class=&quot;grammar-declension-grid&quot;&gt;
          &lt;div class=&quot;grammar-box&quot;&gt;
            &lt;h4&gt;Adjektivdeklination ohne Artikel im Dativ, &lt;span class=&quot;grammar-prefix&quot;&gt;mit&lt;/span&gt;&lt;/h4&gt;
            &lt;table&gt;
              &lt;thead&gt;&lt;tr&gt;&lt;th&gt;die&lt;/th&gt;&lt;th&gt;der&lt;/th&gt;&lt;th&gt;das&lt;/th&gt;&lt;th&gt;Plural&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
              &lt;tbody&gt;
                &lt;tr&gt;&lt;td&gt;&lt;strong&gt;-r&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;-m&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;-m&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;-n&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
                &lt;tr class=&quot;grammar-example&quot;&gt;&lt;td&gt;&lt;span class=&quot;grammar-prefix&quot;&gt;mit&lt;/span&gt; akut&lt;strong&gt;er&lt;/strong&gt; Cholezystitis&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;grammar-prefix&quot;&gt;mit&lt;/span&gt; anaphylaktisch&lt;strong&gt;em&lt;/strong&gt; Schock&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;grammar-prefix&quot;&gt;mit&lt;/span&gt; akut&lt;strong&gt;em&lt;/strong&gt; Nierenversagen&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;grammar-prefix&quot;&gt;mit&lt;/span&gt; rechtsseitig&lt;strong&gt;en&lt;/strong&gt; Rippenfrakturen&lt;/td&gt;&lt;/tr&gt;
              &lt;/tbody&gt;
            &lt;/table&gt;
          &lt;/div&gt;
          &lt;div class=&quot;grammar-box&quot;&gt;
            &lt;h4&gt;Adjektivdeklination ohne Artikel im Akkusativ, &lt;span class=&quot;grammar-prefix&quot;&gt;bei Verdacht auf&lt;/span&gt;&lt;/h4&gt;
            &lt;table&gt;
              &lt;thead&gt;&lt;tr&gt;&lt;th&gt;die&lt;/th&gt;&lt;th&gt;der&lt;/th&gt;&lt;th&gt;das&lt;/th&gt;&lt;th&gt;Plural&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
              &lt;tbody&gt;
                &lt;tr&gt;&lt;td&gt;&lt;strong&gt;-e&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;-n&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;-s&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;-e&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
                &lt;tr class=&quot;grammar-example&quot;&gt;&lt;td&gt;&lt;span class=&quot;grammar-prefix&quot;&gt;bei Verdacht auf&lt;/span&gt; akut&lt;strong&gt;e&lt;/strong&gt; Appendizitis&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;grammar-prefix&quot;&gt;bei Verdacht auf&lt;/span&gt; akut&lt;strong&gt;en&lt;/strong&gt; Infarkt&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;grammar-prefix&quot;&gt;bei Verdacht auf&lt;/span&gt; akut&lt;strong&gt;es&lt;/strong&gt; Nierenversagen&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;grammar-prefix&quot;&gt;bei Verdacht auf&lt;/span&gt; akut&lt;strong&gt;e&lt;/strong&gt; Komplikationen&lt;/td&gt;&lt;/tr&gt;
              &lt;/tbody&gt;
            &lt;/table&gt;
          &lt;/div&gt;
        &lt;/div&gt;`;
      comparisonSection.appendChild(note);
    }
    if(groupIndex===2){
      const note=document.createElement(&#x27;div&#x27;);
      note.className=&#x27;diagnosis-grammar-note&#x27;;
      note.innerHTML=`
        &lt;div class=&quot;grammar-caption&quot;&gt;Kurzhilfe zum Hergang bei der Aufnahme&lt;/div&gt;
        &lt;div class=&quot;grammar-box&quot;&gt;
          &lt;table&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th style=&quot;width:22%&quot;&gt;Form&lt;/th&gt;&lt;th&gt;Standardform&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Aktiv&lt;/strong&gt;&lt;br&gt;Selbstvorstellung&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;&lt;strong&gt;Der Patient stellte sich&lt;/strong&gt; ... &lt;strong&gt;in unserer Notaufnahme vor.&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Aktiv&lt;/strong&gt;&lt;br&gt;Ambulanz&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;&lt;strong&gt;Der Patient stellte sich&lt;/strong&gt; ... &lt;strong&gt;in unserer&lt;/strong&gt; Ambulanz &lt;strong&gt;vor.&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Passiv&lt;/strong&gt;&lt;br&gt;Rettungsdienst&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;&lt;strong&gt;Der Patient wurde&lt;/strong&gt; durch den Rettungsdienst &lt;strong&gt;in unserer Notaufnahme vorgestellt.&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;strong&gt;Passiv&lt;/strong&gt;&lt;br&gt;elektive Aufnahme&lt;/td&gt;&lt;td style=&quot;text-align:left&quot;&gt;&lt;strong&gt;Der Patient wurde&lt;/strong&gt; elektiv stationär &lt;strong&gt;aufgenommen.&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;`;
      comparisonSection.appendChild(note);
    }
    if(groupIndex===3){
      const note=document.createElement(&#x27;div&#x27;);
      note.className=&#x27;diagnosis-grammar-note&#x27;;
      note.innerHTML=`
        &lt;div class=&quot;grammar-caption&quot;&gt;Kurzhilfe zur Hauptsymptomatik und Anamnese&lt;/div&gt;
        &lt;div class=&quot;grammar-box&quot;&gt;
          &lt;table&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Satzmuster&lt;/th&gt;&lt;th style=&quot;width:28%&quot;&gt;Hinweis&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;&lt;strong&gt;Zunächst berichtete er/sie über&lt;/strong&gt; …&lt;/td&gt;&lt;td&gt;&lt;code&gt;über + Akk.&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;&lt;strong&gt;seit&lt;/strong&gt; zwei Tagen &lt;strong&gt;bestehende/zunehmende&lt;/strong&gt; Beschwerden&lt;/td&gt;&lt;td&gt;&lt;code&gt;seit + Dat.&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;plötzlich/akut &lt;strong&gt;aufgetretene&lt;/strong&gt; Beschwerden&lt;/td&gt;&lt;td&gt;Beginn&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;&lt;strong&gt;Zudem/Darüber hinaus gab er/sie an, dass&lt;/strong&gt; …&lt;/td&gt;&lt;td&gt;Konjunktiv I&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;&lt;strong&gt;Ferner klagte er/sie über&lt;/strong&gt; …&lt;/td&gt;&lt;td&gt;&lt;code&gt;über + Akk.&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;… bei Vorstellung &lt;strong&gt;weiterhin bestünden.&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;weiterhin vorhanden&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;er/sie aktuell &lt;strong&gt;schmerzfrei sei.&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;aktuell nicht vorhanden&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;Eine Synkope &lt;strong&gt;wurde verneint.&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Singular&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;Fieber und Gewichtsabnahme &lt;strong&gt;wurden verneint.&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Plural&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;&lt;strong&gt;Dabei habe er/sie&lt;/strong&gt; … erlitten.&lt;/td&gt;&lt;td&gt;Unfallfolge&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;`;
      comparisonSection.appendChild(note);
    }
    if(groupIndex===4){
      const note=document.createElement(&#x27;div&#x27;);
      note.className=&#x27;diagnosis-grammar-note&#x27;;
      note.innerHTML=`
        &lt;div class=&quot;grammar-caption&quot;&gt;Kurzhilfe zu Vorerkrankungen&lt;/div&gt;
        &lt;div class=&quot;grammar-box&quot;&gt;
          &lt;table&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Satzmuster&lt;/th&gt;&lt;th style=&quot;width:28%&quot;&gt;Hinweis&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;&lt;strong&gt;An Vorerkrankungen sei&lt;/strong&gt; … &lt;strong&gt;bekannt.&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Singular&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;&lt;strong&gt;An Vorerkrankungen seien&lt;/strong&gt; … &lt;strong&gt;bekannt.&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;Plural&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;… &lt;strong&gt;mit Erstdiagnose im Jahr&lt;/strong&gt; zweitausend…&lt;/td&gt;&lt;td&gt;Diagnosejahr&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td style=&quot;text-align:left&quot;&gt;&lt;strong&gt;Vorerkrankungen seien nicht bekannt.&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;keine&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;`;
      comparisonSection.appendChild(note);
    }
    cases.forEach(section=&gt;{
      const entry=document.createElement(&#x27;div&#x27;);
      entry.className=&#x27;comparison-case-entry&#x27;;
      entry.dataset.patientGender=section.dataset.patientGender;
      const caseHeading=document.createElement(&#x27;div&#x27;);
      caseHeading.className=&#x27;comparison-case-heading&#x27;;
      caseHeading.textContent=section.querySelector(&#x27;:scope &gt; h2&#x27;).textContent;
      entry.appendChild(caseHeading);
      const caseRows=Array.from(section.querySelectorAll(&#x27;:scope &gt; .case-card &gt; .case-row&#x27;));
      group.keys.forEach(key=&gt;{
        const matchingRow=caseRows.find(row=&gt;rowKey(row)===key);

  function genderMarkedParts(text,gender,patientIdentity){
    const parts=text.split(/(\s+)/);

    parts.forEach((part,partIndex)=&gt;{
      if(/^\s+$/.test(part)) return;

        .replace(/^[^A-Za-zÄÖÜäöüß-]+/,&#x27;&#x27;)

      &#x27;patientin&#x27;,&#x27;patientinnen&#x27;,&#x27;rentnerin&#x27;,&#x27;nichtraucherin&#x27;,&#x27;studentin&#x27;,
      &#x27;raucherin&#x27;,&#x27;büroangestellte&#x27;,&#x27;verkäuferin&#x27;,&#x27;yogalehrerin&#x27;,&#x27;angestellte&#x27;,

      &#x27;er&#x27;,&#x27;ihn&#x27;,&#x27;ihm&#x27;,&#x27;seine&#x27;,&#x27;seinen&#x27;,&#x27;seinem&#x27;,&#x27;seiner&#x27;,&#x27;seines&#x27;,
      &#x27;patient&#x27;,&#x27;patienten&#x27;,&#x27;rentner&#x27;,&#x27;nichtraucher&#x27;,&#x27;angestellter&#x27;,
      &#x27;landschaftsgärtner&#x27;,&#x27;büroangestellter&#x27;,&#x27;kfz-mechatroniker&#x27;,&#x27;kraftfahrer&#x27;,
      &#x27;selbstständiger&#x27;,&#x27;malermeister&#x27;,&#x27;kaufmännischer&#x27;,&#x27;informatiker&#x27;,&#x27;bauarbeiter&#x27;
    ]);
    const singleWords=gender===&#x27;female&#x27;?femaleWords:maleWords;
    words.forEach(word=&gt;{
      if(singleWords.has(word.lower)) marked.add(word.partIndex);

    const patientNouns=gender===&#x27;female&#x27;?new Set([&#x27;patientin&#x27;,&#x27;patientinnen&#x27;]):new Set([&#x27;patient&#x27;,&#x27;patienten&#x27;]);
    const contextWords=gender===&#x27;female&#x27;
      ?new Set([&#x27;die&#x27;,&#x27;der&#x27;,&#x27;eine&#x27;,&#x27;einer&#x27;,&#x27;neue&#x27;,&#x27;neuen&#x27;,&#x27;neuer&#x27;,&#x27;weibliche&#x27;,&#x27;weiblichen&#x27;])

    words.forEach((word,index)=&gt;{

  function appendRenderedWord(target,text,className=&#x27;&#x27;,normalWeight=false){
    const word=document.createElement(&#x27;span&#x27;);

    const segments=Array.from(li.childNodes).map(node=&gt;({
      text:node.textContent,
      bold:node.nodeType===Node.ELEMENT_NODE&amp;&amp;node.tagName===&#x27;STRONG&#x27;,

&lt;section class=&quot;case&quot; data-category=&quot;D. Nephrologie, Stoffwechsel und Hämatologie&quot;&gt;
&lt;h2&gt;D5. Diabetes mellitus Entgleisung&lt;/h2&gt;
&lt;div class=&quot;case-card&quot;&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;Rahmen&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;Arzt-Arzt-Gespräch - Diabetes mellitus mit Entgleisung&lt;/li&gt;
&lt;li&gt;Chefarztvisite: Dr. Meier&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;case-col case-col-right&quot;&gt;
&lt;ul&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Guten Tag&lt;/strong&gt;, Frau Dr. Meier.&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Mein Name ist Temiz und ich bin Stationsarzt.&lt;/strong&gt;&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Ich möchte Ihnen einen neuen Patienten vorstellen.&lt;/strong&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;(Verdachts-)Diagnose/Leitsymptom&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;Diabetes mellitus Typ 2 mit hyperglykämischer Entgleisung&lt;/li&gt;
&lt;/ul&gt;
&lt;h3&gt;Name, Alter&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;Herr Thomas Berger, 55 Jahre&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;case-col case-col-right&quot;&gt;
&lt;ul&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Es handelt sich um&lt;/strong&gt; Herrn Thomas Berger, einen fünfundfünfzig-jährigen Patienten mit Diabetes mellitus Typ zwei und hyperglykämischer Entgleisung.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;Hergang bei der Aufnahme&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;notfallmäßige Einlieferung mit dem Rettungsdienst - durch Frau Berger&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;case-col case-col-right&quot;&gt;
&lt;ul&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Der Patient wurde&lt;/strong&gt; durch den Rettungsdienst &lt;strong&gt;in unserer Notaufnahme vorgestellt.&lt;/strong&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;Hauptsymptomatik, Anamnese&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;deutlich erhöhte Blutzuckerwerte&lt;/li&gt;
&lt;li&gt;seit mehreren Wochen vermehrtes Wasserlassen&lt;/li&gt;
&lt;li&gt;vermehrtes Durstgefühl&lt;/li&gt;
&lt;li&gt;Müdigkeit / Leistungsminderung in der letzten Woche&lt;/li&gt;
&lt;li&gt;BZ-Kontrolle im Rettungswagen: ca. 345 mg/dl&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;case-col case-col-right&quot;&gt;
&lt;ul&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Zunächst berichtete er über&lt;/strong&gt; deutlich erhöhte Blutglukosewerte.&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Zudem gab er an, dass&lt;/strong&gt; seit mehreren Wochen Polyurie und Polydipsie bestünden.&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Ferner klagte er über&lt;/strong&gt; Fatigue und eine Leistungsminderung in der letzten Woche.&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;Im Rettungswagen habe die Blutglukose etwa dreihundertfünfundvierzig Milligramm pro Deziliter betragen.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;Allergien&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;Penicillinallergie&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;case-col case-col-right&quot;&gt;
&lt;ul&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Es bestehe&lt;/strong&gt; eine Penicillinallergie.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;Risikofaktoren&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;Übergewicht, BMI 31 kg/m²&lt;/li&gt;
&lt;li&gt;Bewegungsmangel&lt;/li&gt;
&lt;li&gt;positive Familienanamnese für Diabetes mellitus Typ 2 des Vaters&lt;/li&gt;
&lt;li&gt;regelmäßiger Alkoholkonsum, etwa 2 Bier täglich&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;case-col case-col-right&quot;&gt;
&lt;ul&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Als relevante Risikofaktoren seien&lt;/strong&gt; Übergewicht bei einem BMI von einunddreißig Kilogramm pro Quadratmeter, Bewegungsmangel, eine positive Familienanamnese mit einem Diabetes mellitus Typ zwei beim Vater &lt;strong&gt;sowie&lt;/strong&gt; ein regelmäßiger Alkoholkonsum von etwa zwei Bier täglich &lt;strong&gt;bekannt.&lt;/strong&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;Sozialanamnese&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;Der Patient ist kaufmännischer Angestellter, verheiratet und hat zwei Kinder.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;case-col case-col-right&quot;&gt;
&lt;ul&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Sozialanamnestisch sei er&lt;/strong&gt; kaufmännischer Angestellter, verheiratet und habe zwei Kinder.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;Familienanamnese&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;Vater: Diabetes mellitus Typ 2&lt;/li&gt;
&lt;li&gt;Mutter: koronare Herzerkrankung&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;case-col case-col-right&quot;&gt;
&lt;ul&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Familienanamnestisch bestünden&lt;/strong&gt; ein Diabetes mellitus Typ zwei beim Vater &lt;strong&gt;sowie&lt;/strong&gt; eine koronare Herzerkrankung bei der Mutter.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;case-group-title&quot;&gt;Bisherige Diagnostik&lt;/div&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;Vitalparameter bei Aufnahme&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;Blutdruck: 150/90 mmHg&lt;/li&gt;
&lt;li&gt;Herzfrequenz: 85/min&lt;/li&gt;
&lt;li&gt;Atemfrequenz: 14/min&lt;/li&gt;
&lt;li&gt;Sauerstoffsättigung: 97 %&lt;/li&gt;
&lt;li&gt;Temperatur: 36,8 °C&lt;/li&gt;
&lt;li&gt;Blutzucker: 380 mg/dl&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;case-col case-col-right&quot;&gt;
&lt;ul&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Bei der Aufnahme wurden folgende Vitalparameter erhoben.&lt;/strong&gt;&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Der Blutdruck betrug&lt;/strong&gt; einhundertfünfzig zu neunzig &lt;strong&gt;Millimeter Quecksilbersäule.&lt;/strong&gt;&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Die Herzfrequenz lag bei&lt;/strong&gt; fünfundachtzig &lt;strong&gt;Schlägen pro Minute.&lt;/strong&gt;&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Die Atemfrequenz betrug&lt;/strong&gt; vierzehn &lt;strong&gt;pro Minute.&lt;/strong&gt;&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Die Sauerstoffsättigung lag bei&lt;/strong&gt; siebenundneunzig Prozent.&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Die Körpertemperatur betrug&lt;/strong&gt; sechsunddreißig Komma acht &lt;strong&gt;Grad Celsius.&lt;/strong&gt;&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Die Blutglukose lag&lt;/strong&gt; bei dreihundertachtzig &lt;strong&gt;Milligramm pro Deziliter.&lt;/strong&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;Körperliche Untersuchung&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;abdominal betonte Adipositas, trockene Haut, vermindertes Vibrationsempfinden an beiden Füßen, Hinweis auf beginnende diabetische Polyneuropathie&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;case-col case-col-right&quot;&gt;
&lt;ul&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Bei der körperlichen Untersuchung zeigten sich&lt;/strong&gt; eine abdominal betonte Adipositas und trockene Haut.&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;An beiden Füßen war das Vibrationsempfinden vermindert, als Hinweis auf eine beginnende diabetische Polyneuropathie.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;Bisherige Diagnostik&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;Wiederholung der Blutzuckermessung alle 30–60 Minuten&lt;/li&gt;
&lt;li&gt;Elektrolytersatz (Kalium, Natrium)&lt;/li&gt;
&lt;li&gt;ggf. Serumosmolalität bei Verdacht auf hyperosmolares Syndrom&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;case-col case-col-right&quot;&gt;
&lt;ul&gt;
&lt;li class=&quot;learn-item&quot;&gt;Die Blutglukose soll alle dreißig bis sechzig Minuten erneut bestimmt werden.&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;Kalium und Natrium werden substituiert.&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;Bei Verdacht auf ein hyperosmolares Syndrom soll gegebenenfalls die Serumosmolalität bestimmt werden.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;Neu angesetzte/umgestellte Medikation&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;Insulingabe zunächst als Bolus&lt;/li&gt;
&lt;li&gt;G40 Infusion&lt;/li&gt;
&lt;li&gt;Anpassung der Insulindosis nach BZ-Werten&lt;/li&gt;
&lt;li&gt;Flüssigkeitstherapie angeordnet (Hydratation)&lt;/li&gt;
&lt;li&gt;Überwachung auf Hypoglykämie&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;case-col case-col-right&quot;&gt;
&lt;ul&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Aktuell erfolgt folgende Therapie:&lt;/strong&gt;&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;Initial erhält der Patient Insulin als Bolus und eine G-vierzig-Infusion.&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;Die Insulindosis wird an die Blutglukosewerte angepasst.&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;Zusätzlich erfolgt eine Flüssigkeitstherapie zur Hydratation.&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;Der Patient wird auf Hypoglykämien überwacht.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;Stationärer Verlauf&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;BZ-Wert im Verlauf ca. 319 mg/dl&lt;/li&gt;
&lt;li&gt;unter G40 langsam sinkende Werte&lt;/li&gt;
&lt;li&gt;diabetologische Schulung begonnen&lt;/li&gt;
&lt;li&gt;Ernährungsberatung durchgeführt&lt;/li&gt;
&lt;li&gt;Therapieanpassung&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;case-col case-col-right&quot;&gt;
&lt;ul&gt;
&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Im bisherigen stationären Verlauf zeigte sich Folgendes:&lt;/strong&gt;&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;Die Blutglukose lag bei etwa dreihundertneunzehn Milligramm pro Deziliter und war unter der G-vierzig-Infusion langsam rückläufig.&lt;/li&gt;
&lt;li class=&quot;learn-item&quot;&gt;Eine diabetologische Schulung wurde begonnen, eine Ernährungsberatung durchgeführt und die Therapie angepasst.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;case-row&quot;&gt;
&lt;div class=&quot;case-col case-col-left&quot;&gt;
&lt;h3&gt;Procedere&lt;/h3&gt;
&lt;ul&gt;
&lt;li&gt;Umstellung auf langfristige antidiabetische Therapie&lt;/li&gt;
&lt;li&gt;ambulante Kontrolle von HbA1c in 4 Wochen&lt;/li&gt;
&lt;li&gt;Diabetologische Weiterbetreuung&lt;/li&gt;

&lt;li class=&quot;learn-item&quot;&gt;&lt;strong&gt;Ergänzend&lt;/strong&gt; werden Blutglukoseselbstmessungen, Ernährungsumstellung, regelmäßige körperliche Aktivität und Gewichtsreduktion &lt;strong&gt;empfohlen.&lt;/strong&gt;&lt;/li&gt;
